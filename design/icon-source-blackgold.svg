<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- 金色渐变 -->
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C9A84C"/>
      <stop offset="50%" stop-color="#E8D5A3"/>
      <stop offset="100%" stop-color="#B8943F"/>
    </linearGradient>
    <!-- 外发光滤镜 -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#C9A84C" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- 纯黑圆角背景 -->
  <rect width="512" height="512" rx="100" fill="#0A0A0A"/>

  <!-- 金色边框 -->
  <rect x="40" y="40" width="432" height="432" rx="60"
        fill="none" stroke="url(#gold)" stroke-width="3" opacity="0.6"/>

  <!-- 鲸鱼符号（居中、带外发光） -->
  <g transform="translate(256,256) scale(1.6)" filter="url(#glow)">
    <!-- 鲸鱼身体 -->
    <path d="M-55,-28 C-65,-48 -38,-65 -18,-58 C-8,-53 2,-38 12,-28
             C22,-18 32,-8 42,-3 C52,2 62,12 57,27 C52,42 37,52 22,57
             C7,62 -8,67 -23,62 C-38,57 -53,42 -58,27 C-63,12 -53,-8 -55,-28 Z"
          fill="url(#gold)" opacity="0.9"/>
    <!-- 鲸鱼尾巴 -->
    <path d="M-50,22 C-65,32 -75,22 -70,12 C-65,2 -55,-3 -50,7 Z"
          fill="url(#gold)" opacity="0.9"/>
    <!-- 眼睛（黑色小点，增加灵动感） -->
    <circle cx="-22" cy="-18" r="3.5" fill="#0A0A0A"/>
    <!-- 高光点缀 -->
    <ellipse cx="-15" cy="-25" rx="5" ry="2.5" fill="#FFFFFF" opacity="0.15" transform="rotate(-15,-15,-25)"/>
  </g>

  <!-- HARNESS 文字标记（底部小字，可选） -->
  <text x="256" y="420" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif"
        font-size="18" font-weight="600" letter-spacing="3" fill="url(#gold)" opacity="0.5">HARNESS</text>
</svg>
