<title>deepseekharness-relay · 控制台 v2</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%234D6BFE'/%3E%3Cstop offset='1' stop-color='%236C8CFF'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='15' fill='url(%23g)'/%3E%3Ctext x='32' y='45' font-size='28' text-anchor='middle' fill='white' font-family='monospace' font-weight='bold'%3E%26gt;_%3C/text%3E%3C/svg%3E">
<style>
  :root {
    --bg: #0A0A0A;
    --bg-2: #111118;
    --bg-3: #131320;
    --card: rgba(26, 26, 34, 0.72);
    --card-solid: #1A1A22;
    --card-2: #22222C;
    --bubble: #23232E;
    --border: #33333F;
    --border-soft: rgba(255, 255, 255, 0.08);
    --text: #F2F2F4;
    --muted: #A6A6B4;
    --faint: #787888;
    --accent: #4D6BFE;
    --accent-2: #6C8CFF;
    --accent-soft: rgba(77, 107, 254, 0.14);
    --ok: #34C77B;
    --ok-soft: rgba(52, 199, 123, 0.14);
    --err: #F87171;
    --err-soft: rgba(248, 113, 113, 0.14);
    --radius: 18px;
    --radius-sm: 14px;
    --mono: ui-monospace, "Cascadia Code", "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
    --spring: cubic-bezier(0.32, 0.72, 0, 1);
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
    --safe-left: env(safe-area-inset-left, 0px);
    --safe-right: env(safe-area-inset-right, 0px);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;
    background:
      radial-gradient(130% 42% at 50% -8%, rgba(77, 107, 254, 0.16), transparent 62%),
      radial-gradient(80% 36% at 88% 110%, rgba(108, 140, 255, 0.10), transparent 60%),
      linear-gradient(180deg, #0A0A0A 0%, #131320 100%);
    background-attachment: fixed;
    color: var(--text);
    overflow: hidden;
    -webkit-tap-highlight-color: transparent;
  }
  :focus-visible { outline: 2px solid var(--accent-2); outline-offset: 2px; }
  button { font-family: inherit; touch-action: manipulation; }
  input, textarea { font-family: inherit; }
  svg { flex: none; }

  /* ================= iOS 导航栈 ================= */
  .nav-page {
    position: fixed; inset: 0; margin: 0 auto;
    max-width: 780px;
    display: flex; flex-direction: column;
    transform: translateX(100%);
    transition: transform 0.4s var(--spring), opacity 0.3s ease;
    will-change: transform;
    z-index: 10;
    background: transparent;
  }
  .nav-page.active { transform: translateX(0); z-index: 30; }
  .nav-page.behind { transform: translateX(-27%) scale(0.965); opacity: 0.86; z-index: 20; }
  .nav-page.dragging { transition: none; }
  @media (min-width: 781px) {
    .nav-page { border-left: 1px solid var(--border-soft); border-right: 1px solid var(--border-soft); }
  }

  /* ================= 顶部栏（毛玻璃） ================= */
  .topbar {
    display: flex; align-items: center; gap: 8px;
    padding: calc(var(--safe-top) + 6px) 12px 8px;
    background: rgba(16, 16, 22, 0.72);
    -webkit-backdrop-filter: blur(20px) saturate(150%);
    backdrop-filter: blur(20px) saturate(150%);
    border-bottom: 1px solid var(--border-soft);
    z-index: 30;
    flex: none;
  }
  .conn {
    display: flex; align-items: center; gap: 8px;
    min-height: 40px; max-width: 42vw;
    padding: 0 11px;
    border-radius: 999px;
    border: 1px solid var(--border-soft);
    background: var(--card);
    color: var(--muted);
    cursor: pointer;
    flex: none;
    transition: transform 0.1s ease;
  }
  .conn:active { transform: scale(0.96); }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--faint); flex: none; }
  .dot.on  { background: var(--ok); box-shadow: 0 0 8px var(--ok); }
  .dot.off { background: var(--err); box-shadow: 0 0 8px var(--err); animation: blink 1.2s ease-in-out infinite; }
  .dot.bad { background: var(--err); box-shadow: 0 0 8px var(--err); }
  .dot.na  { background: var(--faint); }
  .conn-text { display: flex; flex-direction: column; min-width: 0; text-align: left; }
  .conn-label { font-size: 12px; font-weight: 600; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .conn-sub { font-size: 10px; color: var(--faint); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  .brand { flex: 1; min-width: 0; text-align: center; }
  .brand-name {
    font-size: 15px; font-weight: 700; letter-spacing: 0.01em;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    background: linear-gradient(135deg, #F2F2F4, #A9B8FF);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .icon-btn {
    display: inline-grid; place-items: center;
    width: 40px; height: 40px;
    border-radius: 12px;
    border: 1px solid var(--border-soft);
    background: var(--card);
    color: var(--text);
    cursor: pointer;
    flex: none;
    transition: transform 0.1s ease;
  }
  .icon-btn:active { transform: scale(0.92); }
  .icon-btn-sm { width: 34px; height: 34px; border-radius: 10px; }

  /* 导航页顶部栏（统一） */
  .navbar { gap: 6px; padding-left: 8px; }
  .navbar .brand { text-align: left; }
  .nav-back { border-radius: 999px; }

  /* 待处理审批徽章 */
  .appr-badge {
    display: inline-flex; align-items: center; gap: 5px;
    min-height: 40px; padding: 0 11px; flex: none;
    border-radius: 999px; border: 1px solid rgba(248, 113, 113, 0.45);
    background: rgba(248, 113, 113, 0.12);
    color: var(--text); font-size: 12px; font-weight: 600;
    cursor: pointer; touch-action: manipulation;
    transition: transform 0.1s ease;
  }
  .appr-badge[hidden] { display: none; }
  .appr-badge:active { transform: scale(0.94); }
  .appr-badge-count { color: #FCA5A5; font-family: var(--mono); font-size: 13px; font-weight: 700; font-variant-numeric: tabular-nums; }

  /* ================= 上下文条（面包屑） ================= */
  .crumb {
    display: flex; align-items: center; gap: 7px;
    padding: 7px 14px;
    background: rgba(16, 16, 22, 0.6);
    -webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px);
    border-bottom: 1px solid var(--border-soft);
    flex: none;
    cursor: pointer;
    overflow: hidden;
  }
  .crumb:active { background: rgba(40, 40, 52, 0.7); }
  .crumb-home {
    flex: none; display: inline-flex; align-items: center; gap: 5px;
    font-size: 11.5px; font-weight: 600; color: #8FA3FF;
    padding: 4px 10px; border-radius: 999px;
    border: 1px solid rgba(77, 107, 254, 0.35);
    background: var(--accent-soft);
    white-space: nowrap;
  }
  .crumb-sep { color: var(--faint); font-size: 12px; flex: none; }
  .crumb-cur {
    flex: 1; min-width: 0; text-align: left;
    font-size: 12px; color: var(--muted);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }

  /* ================= 页面主体 ================= */
  .page-body {
    flex: 1; overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    overscroll-behavior: contain;
    padding: 12px 14px calc(24px + var(--safe-bottom));
  }
  .page-body::-webkit-scrollbar { width: 6px; }
  .page-body::-webkit-scrollbar-thumb { background: #2A2A36; border-radius: 6px; }

  /* ================= 搜索框 ================= */
  .searchbox { position: relative; margin-bottom: 12px; }
  .searchbox svg {
    position: absolute; left: 13px; top: 50%; transform: translateY(-50%);
    color: var(--faint); pointer-events: none;
  }
  .searchbox input {
    width: 100%; min-height: 42px;
    padding: 0 14px 0 38px;
    border-radius: 14px;
    border: 1px solid var(--border-soft);
    background: var(--card);
    color: var(--text);
    font-size: 14px;
    outline: none;
    -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
    transition: border-color 0.15s ease;
  }
  .searchbox input::placeholder { color: var(--faint); }
  .searchbox input:focus { border-color: var(--accent); }

  /* ================= 分组标题 ================= */
  .dsec { margin-top: 14px; }
  .dsec:first-child { margin-top: 2px; }
  .dsec-title {
    display: flex; align-items: center; gap: 8px;
    margin: 0 4px 9px; font-size: 12px; font-weight: 600; color: var(--faint);
    letter-spacing: 0.05em;
  }
  .dsec-count { font-weight: 500; color: var(--muted); }
  .dsec-note { margin: 8px 4px 0; font-size: 11px; color: var(--faint); line-height: 1.55; }
  .dsec-empty { padding: 18px 0; text-align: center; font-size: 12.5px; color: var(--faint); }

  /* ================= 项目（工作区）列表 ================= */
  .ws-item {
    display: flex; align-items: center; gap: 11px;
    width: 100%;
    padding: 12px 14px; margin-bottom: 9px;
    border-radius: var(--radius-sm);
    border: 1px solid var(--border-soft);
    background: var(--card);
    -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
    color: var(--text);
    text-align: left; cursor: pointer;
    transition: transform 0.1s ease, border-color 0.15s ease;
  }
  .ws-item:active { transform: scale(0.975); border-color: rgba(77, 107, 254, 0.5); }
  .ws-icon {
    flex: none; width: 40px; height: 40px; border-radius: 12px;
    display: grid; place-items: center; font-size: 18px;
    background: linear-gradient(135deg, var(--accent-soft), rgba(108, 140, 255, 0.06));
    border: 1px solid rgba(77, 107, 254, 0.25);
  }
  .ws-main { flex: 1; min-width: 0; }
  .ws-title { font-size: 14.5px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ws-path { font-size: 11px; color: var(--faint); margin-top: 2px; font-family: var(--mono); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .badge {
    flex: none; min-width: 24px; height: 22px; padding: 0 7px;
    display: inline-flex; align-items: center; justify-content: center;
    border-radius: 999px;
    font-family: var(--mono); font-size: 11.5px; font-weight: 700;
    color: #C6D2FF; background: linear-gradient(135deg, rgba(77, 107, 254, 0.35), rgba(108, 140, 255, 0.18));
    border: 1px solid rgba(108, 140, 255, 0.35);
    font-variant-numeric: tabular-nums;
  }
  .badge.pop { animation: badgePop 0.5s var(--spring); }

  /* ================= 本地会话 / DSH 会话列表 ================= */
  .sess-item {
    display: flex; align-items: center; gap: 4px;
    border: 1px solid var(--border-soft);
    border-radius: var(--radius-sm);
    background: var(--card);
    -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
    margin-bottom: 8px; overflow: hidden;
  }
  .sess-item.active { border-color: rgba(77, 107, 254, 0.55); background: rgba(77, 107, 254, 0.1); }
  .sess-icon {
    flex: none; width: 40px; height: 40px; margin: 8px 0 8px 10px;
    border-radius: 11px; display: grid; place-items: center; font-size: 17px;
    background: rgba(255, 255, 255, 0.05); border: 1px solid var(--border-soft);
  }
  .sess-main { flex: 1; min-width: 0; padding: 10px 12px 10px 0; cursor: pointer; }
  .sess-title { font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .sess-meta { font-size: 11px; color: var(--faint); margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-family: var(--mono); }
  .sess-del {
    flex: none; width: 42px; height: 42px; margin-right: 4px;
    background: none; border: none; color: var(--faint);
    display: grid; place-items: center; border-radius: 10px; font-size: 12px;
  }
  .sess-del.confirm { color: var(--err); background: rgba(248, 113, 113, 0.14); font-weight: 700; }
  .new-sess-btn {
    display: flex; align-items: center; justify-content: center; gap: 7px;
    width: 100%; min-height: 44px;
    border-radius: var(--radius-sm);
    border: 1px dashed rgba(77, 107, 254, 0.45);
    background: rgba(77, 107, 254, 0.08);
    color: #8FA3FF; font-size: 14px; font-weight: 600; cursor: pointer;
    transition: transform 0.1s ease;
  }
  .new-sess-btn:active { transform: scale(0.98); }

  /* ================= Agent 活动（子代理列表） ================= */
  .agt-item {
    display: flex; align-items: center; gap: 11px;
    padding: 11px 14px; margin-bottom: 8px;
    border-radius: var(--radius-sm);
    border: 1px solid var(--border-soft);
    background: var(--card);
    -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
  }
  .agt-avatar {
    flex: none; width: 40px; height: 40px; border-radius: 12px;
    display: grid; place-items: center; font-size: 18px;
    background: linear-gradient(135deg, var(--accent-soft), rgba(108, 140, 255, 0.06));
    border: 1px solid rgba(77, 107, 254, 0.25);
  }
  .agt-main { flex: 1; min-width: 0; }
  .agt-title { font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .agt-meta { font-size: 11px; color: var(--faint); margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-family: var(--mono); }
  .agt-pill {
    flex: none; display: inline-flex; align-items: center; gap: 5px;
    padding: 3px 8px; border-radius: 999px;
    font-size: 11px; font-weight: 600; font-family: var(--mono);
  }
  .agt-pill::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
  .agt-pill.running { color: var(--ok); background: var(--ok-soft); }
  .agt-pill.running::before { box-shadow: 0 0 6px var(--ok); animation: blink 1.2s ease-in-out infinite; }
  .agt-pill.idle { color: var(--faint); background: rgba(255, 255, 255, 0.06); }
  .agt-pill.other { color: #C6D2FF; background: rgba(77, 107, 254, 0.16); }
  .agt-refresh { margin-left: auto; min-height: 30px; padding: 0 10px; }

  /* 提示条（API 缺口 / 加载中） */
  .proj-note {
    margin: 10px 4px 4px;
    padding: 9px 12px;
    border-radius: 12px;
    font-size: 12px; line-height: 1.55;
    border: 1px solid rgba(248, 113, 113, 0.25);
    background: rgba(248, 113, 113, 0.08);
    color: #FCA5A5;
  }
  .proj-note.info { border-color: rgba(108, 140, 255, 0.3); background: var(--accent-soft); color: #C6D2FF; }

  /* ================= 页面底部：连接与设置 ================= */
  .proj-foot { margin-top: 18px; }
  .conn-row {
    display: flex; align-items: center; gap: 10px;
    width: 100%; min-height: 48px; margin-bottom: 10px;
    padding: 0 14px; border-radius: 14px;
    border: 1px solid var(--border-soft);
    background: var(--card);
    color: var(--text); cursor: pointer; text-align: left;
    -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
    transition: transform 0.1s ease;
  }
  .conn-row:active { transform: scale(0.98); }
  .conn-row .conn-label { font-size: 13px; }
  .st-card { border: 1px solid var(--border-soft); border-radius: var(--radius-sm); background: var(--card); padding: 2px 14px; -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); }
  .st-row { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--border-soft); font-size: 13px; }
  .st-row:last-child { border-bottom: none; }
  .st-k { color: var(--muted); flex: none; }
  .st-v { color: var(--text); text-align: right; word-break: break-all; font-family: var(--mono); font-size: 12px; }
  .st-actions { display: flex; gap: 8px; margin-top: 10px; }
  .mini-btn {
    display: inline-flex; align-items: center; gap: 6px;
    min-height: 40px; padding: 0 13px;
    border-radius: 11px; border: 1px solid var(--border);
    background: var(--card); color: var(--muted); font-size: 12.5px; cursor: pointer;
    transition: transform 0.1s ease;
  }
  .mini-btn:active { transform: scale(0.96); }

  /* ================= 对话区 ================= */
  .chat {
    flex: 1;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    overscroll-behavior: contain;
    display: flex;
    flex-direction: column;
    gap: 14px;
    padding: 16px 14px 14px;
  }
  .chat::-webkit-scrollbar { width: 6px; }
  .chat::-webkit-scrollbar-thumb { background: #2A2A36; border-radius: 6px; }

  .msg { display: flex; flex-direction: column; gap: 5px; max-width: 86%; }
  .msg.user { align-self: flex-end; align-items: flex-end; }
  .msg.assistant { align-self: flex-start; align-items: flex-start; }

  .bubble { padding: 11px 14px; font-size: 15px; line-height: 1.6; white-space: pre-wrap; word-break: break-word; }
  .bubble.user {
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    color: #FFFFFF;
    border-radius: 18px 18px 4px 18px;
    box-shadow: 0 6px 18px rgba(77, 107, 254, 0.28);
  }
  .bubble.asst {
    background: var(--card);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 4px 18px 18px 18px;
    -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
  }
  .meta { font-size: 11px; color: var(--faint); padding: 0 4px; }

  /* 助手消息内部 */
  .asst-head { display: flex; align-items: center; gap: 6px; margin-bottom: 8px; flex-wrap: wrap; }
  .asst-name { font-size: 12px; font-weight: 600; color: #8FA3FF; }
  .chip { font-size: 10.5px; font-weight: 600; padding: 2px 8px; border-radius: 999px; letter-spacing: 0.02em; }
  .chip.ok { color: var(--ok); background: var(--ok-soft); }
  .chip.fail { color: var(--err); background: var(--err-soft); }
  .chip.backend { color: var(--muted); background: rgba(255, 255, 255, 0.06); font-family: var(--mono); font-size: 10px; }
  .asst-body { white-space: normal; font-size: 14.5px; max-height: 50vh; overflow-y: auto; }
  .asst-body p { margin: 0 0 8px; }
  .asst-body p:last-child { margin-bottom: 0; }
  .asst-body h2, .asst-body h3, .asst-body h4, .asst-body h5, .asst-body h6 { margin: 10px 0 6px; font-weight: 700; line-height: 1.35; }
  .asst-body h2 { font-size: 16px; } .asst-body h3 { font-size: 15px; } .asst-body h4 { font-size: 14px; }
  .asst-body h5, .asst-body h6 { font-size: 13.5px; }
  .asst-body ul, .asst-body ol { margin: 4px 0 8px; padding-left: 20px; }
  .asst-body li { margin: 3px 0; }
  .asst-body code { font-family: var(--mono); font-size: 12.5px; background: #1C1C26; border: 1px solid var(--border); border-radius: 6px; padding: 1.5px 5px; color: #9FB4FF; }
  .asst-body pre { background: #16161F; border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; margin: 6px 0 10px; overflow-x: auto; }
  .asst-body pre code { background: none; border: none; padding: 0; color: var(--text); font-size: 12px; line-height: 1.55; display: block; white-space: pre-wrap; word-break: break-word; }
  .asst-body blockquote { margin: 6px 0; padding: 2px 12px; border-left: 3px solid var(--accent); color: var(--muted); }
  .asst-body hr { border: none; border-top: 1px solid var(--border); margin: 10px 0; }
  .asst-body a { color: #8FA3FF; text-decoration: none; }
  .stderr { margin-top: 10px; border: 1px solid rgba(248, 113, 113, 0.35); background: rgba(248, 113, 113, 0.08); border-radius: 10px; padding: 9px 11px; }
  .stderr-lbl { font-size: 11px; font-weight: 600; color: #FCA5A5; margin-bottom: 5px; letter-spacing: 0.04em; }
  .stderr pre { margin: 0; font-family: var(--mono); font-size: 12px; line-height: 1.55; white-space: pre-wrap; word-break: break-word; color: #FCA5A5; max-height: 32vh; overflow: auto; }
  .noout { color: var(--faint); font-size: 13px; padding: 2px 0; }
  .asst-meta { margin-top: 8px; display: flex; gap: 10px; font-size: 11px; color: var(--faint); align-items: center; }

  /* 流式输出（打字机） */
  .stream-text { white-space: pre-wrap; word-break: break-word; font-size: 14.5px; line-height: 1.6; min-height: 1.3em; }
  .stream-cursor {
    display: inline-block; width: 2px; height: 1.05em;

  /* 工具卡片（执行详情） */

  .tc-name { font-family: var(--mono); color: var(--text); flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tc-time { font-family: var(--mono); font-size: 11px; color: var(--faint); }

  .tool-card.open .tc-body { display: block; }
  .tc-row { display: flex; align-items: center; gap: 8px; padding: 8px 12px; border-bottom: 1px solid var(--border-soft); font-size: 11.5px; }
  .tc-k { color: var(--faint); }

  .tc-v.ok { color: var(--ok); } .tc-v.err { color: var(--err); }
  .tc-body pre { margin: 0; padding: 10px 12px; font-family: var(--mono); font-size: 12px; line-height: 1.55; white-space: pre-wrap; word-break: break-word; color: var(--muted); max-height: 40vh; overflow: auto; }

  /* 审批卡片（对话流） */
  .appr-card { width: 100%; margin-left: 8px; border: 1px solid var(--border); border-radius: var(--radius-sm); background: var(--card); overflow: hidden; }
  .appr-card.pending { border-color: rgba(77, 107, 254, 0.45); }

  .appr-chip.err { color: var(--err); background: var(--err-soft); }

  .appr-body { padding: 10px 12px 12px; }
  .appr-tool {
    font-family: var(--mono); font-size: 13.5px; font-weight: 700; color: var(--text);

  .appr-callid { margin-top: 5px; font-family: var(--mono); font-size: 10.5px; color: var(--faint); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .appr-actions { display: flex; gap: 8px; margin-top: 12px; }
  .appr-btn {

  .appr-result { display: flex; align-items: center; gap: 7px; margin-top: 12px; font-size: 12.5px; color: var(--muted); }

  /* 正在执行… */

  /* ================= 底部输入栏 ================= */
  .inputbar {

  .token-row .input { flex: 1; min-width: 0; }
  .input {
    display: block; width: 100%;
    background: var(--card-2); color: var(--text);
    border: 1px solid var(--border); border-radius: 12px;
    padding: 12px 14px; font-size: 16px; outline: none;
    transition: border-color 0.15s ease;
  }
  .input::placeholder { color: var(--faint); }
  .input:focus { border-color: var(--accent); }
  .mono { font-family: var(--mono); }
  .ov-actions { display: flex; gap: 8px; margin-top: 14px; }
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    min-height: 46px; padding: 0 18px;
    border-radius: 12px; font-size: 15px; font-weight: 600;
    cursor: pointer; border: none; font-family: inherit;

  .btn:active { transform: scale(0.97); }
  .btn.primary { background: linear-gradient(135deg, var(--accent), var(--accent-2)); color: #fff; flex: 1; }
  .btn.ghost { background: none; border: 1px solid var(--border); color: var(--muted); }
  .btn.full { width: 100%; margin-top: 10px; }

  /* ================= Toast ================= */
  .toast {
    position: fixed; left: 50%;
    bottom: calc(var(--safe-bottom) + 84px);

<script>
(function () {
  'use strict';

  /* ================= 常量与工具 ================= */
  var $ = function (id) { return document.getElementById(id); };
  var LS_TOKEN = 'ph_token';
  var LS_SESSIONS = 'ph_sessions';
  var LS_PREFIX = 'ph_msgs_';
  var LS_DSH_PREFIX = 'ph_dsh_';
  var STATUS_INTERVAL = 8000;   // /api/status 心跳
  var HISTORY_LIMIT = 30;
  var SYNC_STALE_MS = 30000;    // 工作区/会话同步缓存时长
  var EVENT_INTERVAL = 1000;    // 流式事件轮询间隔

  var state = {
    token: localStorage.getItem(LS_TOKEN) || '',
    sessions: [],        // 本地会话 [{id, title, createdAt, lastUsedAt, serverSessionId?}]
    currentId: null,
    view: { kind: 'local', id: null }, // {kind:'local',id} | {kind:'dsh',sessionId,projectTitle,sessionTitle}
    running: false,
    runSid: null,
    runStart: 0,
    runTimer: null,
    serverSessions: false,
    status: null,
    globalHistory: [],
    pendingApprovals: [],
    _approvalBusy: false,
    // DSH 同步
    workspaces: [],        // [{workspaceId, path, title, sessionCount}]
    wsOk: false,
    wsError: '',
    wsLoadedAt: 0,
    dshSessions: [],       // [{sessionId, cwd, title?, updatedAt}]
    dshOk: false,
    dshLoadedAt: 0,
    currentProject: null,  // 层级2 当前项目
    dshHistory: null,      // 当前 DSH 会话历史（null=加载中）
    dshHistError: '',
    stream: null,          // 流式状态
    streamAvail: undefined,
    streamBaseSeq: 0,
    _polling: false,
    projQuery: '',
    sessQuery: '',
    // Agent 活动
    agents: null,          // 最近一次 /api/agents 结果 {parentAvailable, items}:[]（null=加载中）
    agentsError: '',
    agentsSid: '',         // 显示中所用的 sessionId
    agentsLoadedAt: 0
  };

  var ICON_GEAR = '<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>';
  var ICON_CHEV = '<svg class="tc-chev" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>';
  var ICON_TRASH = '<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></svg>';
  var ICON_EYE = '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>';
  var ICON_EYE_OFF = '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>';
  var ICON_SHIELD = '<svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>';

  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text !== undefined) n.textContent = text;
    return n;
  }
  function uid() { return 's-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 10); }
  function hasText(s) { return typeof s === 'string' && s.trim().length > 0; }
  function escHtml(s) {
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }
  function enc(s) { return encodeURIComponent(String(s == null ? '' : s)); }
  function firstLine(s, n) {
    var t = String(s || '').split('\n')[0].trim();
    if (!t) return '（空任务）';
    return t.length > n ? t.slice(0, n) + '…' : t;
  }
  function baseName(p) {
    var s = String(p || '').replace(/[\\/]+$/, '');
    var i = Math.max(s.lastIndexOf('/'), s.lastIndexOf('\\'));
    return i >= 0 ? s.slice(i + 1) : (s || '未命名');
  }
  function fmtElapsed(ms) {
    if (typeof ms !== 'number' || isNaN(ms)) return '—';
    var s = ms / 1000;
    if (s < 60) return s.toFixed(1) + ' 秒';
    var m = Math.floor(s / 60);
    var sec = Math.round(s % 60);
    return m + ' 分 ' + sec + ' 秒';
  }
  function fmtTime(iso, withSec) {
    if (!iso) return '';
    var d = new Date(iso);
    if (isNaN(d.getTime())) return '';
    var opt = { hour12: false, month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit' };
    if (withSec) opt.second = '2-digit';
    try { return d.toLocaleString('zh-CN', opt); } catch (e) { return ''; }
  }
  function fmtAgo(iso) {
    if (!iso) return '';
    var d = new Date(iso);
    if (isNaN(d.getTime())) return '';
    var s = (Date.now() - d.getTime()) / 1000;
    if (s < 60) return '刚刚';
    if (s < 3600) return Math.floor(s / 60) + ' 分钟前';
    if (s < 86400) return Math.floor(s / 3600) + ' 小时前';
    if (s < 86400 * 7) return Math.floor(s / 86400) + ' 天前';
    return fmtTime(iso);
  }
  function httpErr(msg, code) { var e = new Error(msg); e.code = code; return e; }

  /* ================= API ================= */
  async function api(path, opts) {
    opts = opts || {};
    var headers = { authorization: 'Bearer ' + state.token };
    if (opts.body) headers['content-type'] = 'application/json';
    if (opts.headers) Object.assign(headers, opts.headers);
    var ctrl = null, timer = null;
    if (opts.timeoutMs) {
      ctrl = new AbortController();
      timer = setTimeout(function () { ctrl.abort(); }, opts.timeoutMs);
    }
    var r;
    try {
      r = await fetch(path, {
        method: opts.method || 'GET',
        body: opts.body,
        headers: headers,
        signal: ctrl ? ctrl.signal : undefined
      });
    } catch (e) {
      if (e && e.name === 'AbortError') throw httpErr('请求超时，请检查网络与 Agent 状态', 'NET');
      throw httpErr('无法连接 Agent，请确认电脑端已启动且与手机在同一网络', 'NET');
    } finally {
      if (timer) clearTimeout(timer);
    }
    var data = null;
    try { data = await r.json(); } catch (e) { /* 非 JSON 响应 */ }
    if (r.status === 401) throw httpErr('令牌无效，请检查 Token', 401);
    if (!r.ok) throw httpErr((data && data.error) || '请求失败（HTTP ' + r.status + '）', r.status);
    return data;
  }

  /* ================= 本地会话存储 ================= */
  function loadSessions() { try { return JSON.parse(localStorage.getItem(LS_SESSIONS) || '[]'); } catch (e) { return []; } }
  function saveSessions() { localStorage.setItem(LS_SESSIONS, JSON.stringify(state.sessions)); }
  function loadMsgs(sid) { try { return JSON.parse(localStorage.getItem(LS_PREFIX + sid) || '[]'); } catch (e) { return []; } }
  function saveMsgs(sid, msgs) { localStorage.setItem(LS_PREFIX + sid, JSON.stringify(msgs)); }
  function loadDshMsgs(sid) { try { return JSON.parse(localStorage.getItem(LS_DSH_PREFIX + sid) || '[]'); } catch (e) { return []; } }
  function saveDshMsgs(sid, msgs) { localStorage.setItem(LS_DSH_PREFIX + sid, JSON.stringify(msgs)); }
  function newSessionObj() {
    return { id: uid(), title: '新会话', createdAt: new Date().toISOString(), lastUsedAt: new Date().toISOString() };
  }
  function ensureSession() {
    if (state.currentId && state.sessions.some(function (s) { return s.id === state.currentId; })) return state.currentId;
    if (!state.sessions.length) { state.sessions.push(newSessionObj()); saveSessions(); }
    state.currentId = state.sessions[0].id;
    return state.currentId;
  }
  function touchSession(id) {
    var s = state.sessions.find(function (x) { return x.id === id; });
    if (s) { s.lastUsedAt = new Date().toISOString(); saveSessions(); }
  }
  function newSession() {
    var s = newSessionObj();
    state.sessions.unshift(s);
    saveSessions();
    switchSession(s.id);
    return s.id;
  }
  function switchSession(id) {
    if (!state.sessions.some(function (s) { return s.id === id; })) return;
    state.currentId = id;
    state.view = { kind: 'local', id: id };
    touchSession(id);
    renderMessages('bottom');
    updateCrumb();
  }
  function deleteSession(id) {
    localStorage.removeItem(LS_PREFIX + id);
    state.sessions = state.sessions.filter(function (s) { return s.id !== id; });
    if (!state.sessions.length) state.sessions.push(newSessionObj());
    saveSessions();
    if (!state.sessions.some(function (s) { return s.id === state.currentId; })) {
      state.currentId = state.sessions[0].id;
      state.view = { kind: 'local', id: state.currentId };
    }
    renderMessages('bottom');
    updateCrumb();
  }

  /* ================= iOS 导航栈 ================= */
  var NAV_PAGES = null;
  var navTop = 0;

  function applyNav() {
    for (var i = 0; i < NAV_PAGES.length; i++) {
      var p = NAV_PAGES[i];
      p.classList.toggle('active', i === navTop);
      p.classList.toggle('behind', i < navTop);
      p.setAttribute('aria-hidden', i === navTop ? 'false' : 'true');
    }
  }
  function navPush(idx) {
    if (idx <= navTop || idx >= NAV_PAGES.length) return;
    navTop = idx;
    applyNav();
    if (idx === 1) onProjectsOpened();
    if (idx === 2) renderSessionsPage();
  }
  function navPop() {
    if (navTop <= 0) return;
    navTop--;
    applyNav();
  }
  function navPopTo(idx) {
    if (idx >= navTop) return;
    navTop = idx;
    applyNav();
  }

  // iOS 风格右滑返回手势（左侧边缘触发，带视差）
  function attachSwipe(pageEl) {
    var startX = 0, startY = 0, dx = 0, active = false, dragging = false;
    pageEl.addEventListener('touchstart', function (e) {
      if (e.touches.length !== 1) return;
      if (!pageEl.classList.contains('active')) return;
      var t = e.touches[0];
      startX = t.clientX; startY = t.clientY; dx = 0; active = true; dragging = false;
    }, { passive: true });
    pageEl.addEventListener('touchmove', function (e) {
      if (!active) return;
      var t = e.touches[0];
      dx = t.clientX - startX;
      var dy = Math.abs(t.clientY - startY);
      if (!dragging && dx > 10 && dy < dx * 1.8) {
        dragging = true;
        pageEl.classList.add('dragging');
        applyDrag(0);
      }
      if (!dragging) return;
      e.preventDefault();
      applyDrag(dx);
    }, { passive: false });
    pageEl.addEventListener('touchend', function () {
      if (!dragging) { active = false; return; }
      var w = window.innerWidth;
      var shouldPop = dx > w * 0.28;
      pageEl.classList.remove('dragging');
      resetDrag();
      if (shouldPop) navPop();
      active = false; dragging = false;
    });
    function prevPage() {
      var idx = NAV_PAGES.indexOf(pageEl);
      return idx > 0 ? NAV_PAGES[idx - 1] : null;
    }
    function applyDrag(x) {
      x = Math.max(0, Math.min(x, window.innerWidth));
      pageEl.style.transform = 'translateX(' + x + 'px)';
      var prev = prevPage();
      if (prev) prev.style.transform = 'translateX(calc(-27% + ' + (x * 0.38) + 'px)) scale(0.965)';
    }
    function resetDrag() {
      pageEl.style.transform = '';
      var prev = prevPage();
      if (prev) prev.style.transform = '';
    }
  }

  /* ================= DSH 工作区 / 会话同步 ================= */
  async function loadWorkspaces(force) {
    if (!state.token) return;
    if (!force && state.wsOk && Date.now() - state.wsLoadedAt < SYNC_STALE_MS) return;
    try {
      var r = await api('/api/dsh-workspaces', { timeoutMs: 6000 });
      state.workspaces = (r && r.items) || [];
      state.wsOk = true;
      state.wsError = '';
      state.wsLoadedAt = Date.now();
    } catch (e) {
      state.workspaces = [];
      state.wsOk = false;
      state.wsError = e.code === 404 ? '后端未实现 /api/dsh-workspaces' : (e.message || '同步失败');
    }
    renderProjects();
  }

  async function loadDshSessions(force) {
    if (!state.token) return;
    if (!force && state.dshOk && Date.now() - state.dshLoadedAt < SYNC_STALE_MS) return;
    try {
      var r = await api('/api/dsh-sessions', { timeoutMs: 8000 });
      state.dshSessions = (r && r.items) || [];
      state.dshOk = true;
      state.dshLoadedAt = Date.now();
    } catch (e) {
      state.dshSessions = [];
      state.dshOk = false;
    }
    renderProjects();
  }

  // cwd 是否位于工作区路径下（Windows/Unix 分隔符归一化）
  function cwdUnder(cwd, wsPath) {
    if (!cwd || !wsPath) return false;
    var c = String(cwd).replace(/\\/g, '/').toLowerCase().replace(/\/+$/, '');
    var p = String(wsPath).replace(/\\/g, '/').toLowerCase().replace(/\/+$/, '');
    if (!p) return false;
    return c === p || c.indexOf(p + '/') === 0;
  }

  // 「📂 未分组」伪项目桶：收纳 ungrouped=true 的电脑会话（层级1 展示、层级2 复用会话列表页）
  var UNGROUPED_WS = { workspaceId: '__ungrouped__', path: '', title: '未分组', ungrouped: true };

  function projectSessions(ws) {
    if (!ws) return [];
    var list;
    if (ws.ungrouped) {
      list = state.dshSessions.filter(function (s) { return s.ungrouped === true; });
    } else {
      list = state.dshSessions.filter(function (s) { return cwdUnder(s.cwd, ws.path); });
    }
    list.sort(function (a, b) { return String(b.updatedAt || '').localeCompare(String(a.updatedAt || '')); });
    return list;
  }

  // 按需拉取消息数（messageCount）：只给打开的项目会话列表用，避免全量开销。
  // withCount=true 会为每个会话读一次历史计数，因此仅进入层级2 时触发一次并合并回 state.dshSessions。
  async function loadDshSessionCounts() {
    if (!state.token) return;
    try {
      var r = await api('/api/dsh-sessions?withCount=true', { timeoutMs: 12000 });
      var items = (r && r.items) || [];
      var byId = {};
      items.forEach(function (s) { byId[s.sessionId] = s; });
      state.dshSessions.forEach(function (s) {
        var match = byId[s.sessionId];
        if (match && typeof match.messageCount === 'number') s.messageCount = match.messageCount;
        else s.messageCount = undefined;
      });
      renderSessionsPage();
      renderProjects();
    } catch (e) {
      // 计数加载失败不阻塞：列表仍可用，只是不显示消息数
    }
  }

  function onProjectsOpened() {
    renderProjects();
    renderSettingsStatus();
    if (state.token) {
      refreshGlobalHistory(true);
      loadWorkspaces(false);
      loadDshSessions(false);
    }
  }

  function renderProjects() {
    var q = state.projQuery;
    var wsBox = $('wsList');
    var localBox = $('localList');
    wsBox.textContent = '';
    localBox.textContent = '';

    // 同步状态提示
    var syncNote = $('wsSyncNote');
    if (!syncNote) {
      syncNote = el('div', 'proj-note');
      syncNote.id = 'wsSyncNote';
      wsBox.parentNode.insertBefore(syncNote, wsBox);
    }
    if (!state.token) {
      syncNote.className = 'proj-note info';
      syncNote.textContent = '未设置 Token：DSH 工作区与电脑会话暂不可见。';
      syncNote.hidden = false;
    } else if (!state.wsOk && !state.dshOk) {
      syncNote.className = 'proj-note';
      syncNote.textContent = 'DSH 同步不可用（' + (state.wsError || '未知错误') + '）。仅显示「我的对话」，仍可正常发送任务。';
      syncNote.hidden = false;
    } else {
      syncNote.hidden = true;
    }

    // DSH 工作区
    var wss = state.workspaces.filter(function (w) {
      if (!q) return true;
      return (String(w.title || '').toLowerCase().indexOf(q) > -1) ||
             (String(w.path || '').toLowerCase().indexOf(q) > -1);
    });
    $('wsCount').textContent = state.wsOk ? (wss.length + ' / ' + state.workspaces.length) : '—';

      item.innerHTML =

        '<span class="ws-main"><span class="ws-title">' + escHtml(w.title || baseName(w.path)) + '</span>' +
        '<span class="ws-path">' + escHtml(w.path || '') + '</span></span>' +
        '<span class="badge">' + count + '</span>';

        b.classList.add('pop');
        setTimeout(function () { b.classList.remove('pop'); }, 500);
      }
      state._wsCounts[w.workspaceId] = count;
      item.addEventListener('click', function () { openProject(w); });
      wsBox.appendChild(item);

    // 未分组项目桶（存在 ungrouped 电脑会话时显示，点击复用会话列表页）
    var ungroupedSec = $('ungroupedSec');
    var ungroupedList = $('ungroupedList');
    if (ungroupedSec) {
      var hasUngrouped = state.dshOk && projectSessions(UNGROUPED_WS).length > 0;
      ungroupedSec.hidden = !hasUngrouped;
    }
    if (ungroupedList) {
      ungroupedList.textContent = '';
      if (state.dshOk && ungroupedSec && !ungroupedSec.hidden) {
        var upCount = projectSessions(UNGROUPED_WS).length;
        $('ungroupedCount').textContent = upCount ? upCount + ' 个会话' : '';
        var uitem = document.createElement('button');
        uitem.type = 'button';
        uitem.className = 'ws-item';
        uitem.innerHTML =
          '<span class="ws-icon">📂</span>' +
          '<span class="ws-main"><span class="ws-title">未分组</span>' +
          '<span class="ws-path">cwd 未匹配任何工作区</span></span>' +
          '<span class="badge">' + upCount + '</span>';
        uitem.addEventListener('click', function () { openProject(UNGROUPED_WS); });
        ungroupedList.appendChild(uitem);
      }
    }

    // 我的对话（本地会话）
    var locals = state.sessions.filter(function (s) {
      if (!q) return true;
      return String(s.title || '').toLowerCase().indexOf(q) > -1;
    });
    $('localCount').textContent = locals.length ? '共 ' + locals.length : '';
    locals.forEach(function (s) {
      var item = el('div', 'sess-item' + (s.id === state.currentId ? ' active' : ''));
      var icon = el('span', 'sess-icon', '💬');
      var main = el('div', 'sess-main');
      main.appendChild(el('div', 'sess-title', s.title || '新会话'));
      var cnt = loadMsgs(s.id).length;
      main.appendChild(el('div', 'sess-meta', (cnt ? cnt + ' 条消息 · ' : '') + fmtAgo(s.lastUsedAt || s.createdAt)));
      main.addEventListener('click', function () { switchSession(s.id); navPopTo(0); });
      var del = document.createElement('button');
      del.type = 'button';
      del.className = 'sess-del';
      del.setAttribute('aria-label', '删除会话');
      del.innerHTML = ICON_TRASH;
      del.addEventListener('click', function () { confirmDelete(del, s.id); });
      item.appendChild(icon);
      item.appendChild(main);
      item.appendChild(del);
      localBox.appendChild(item);
    });

  function confirmDelete(btn, id) {
    if (btn.classList.contains('confirm')) {
      btn.classList.remove('confirm');
      btn.innerHTML = ICON_TRASH;
      clearTimeout(btn._t);
      deleteSession(id);
      toast('会话已删除');
      renderProjects();
      return;
    }
    btn.classList.add('confirm');
    btn.textContent = '确认';
    clearTimeout(btn._t);
    btn._t = setTimeout(function () {
      btn.classList.remove('confirm');
      btn.innerHTML = ICON_TRASH;
    }, 2500);
  }

  function openProject(ws) {
    state.currentProject = ws;
    if (!state.dshOk) loadDshSessions(true);
    renderSessionsPage();
    navPush(2);
    // 进入会话列表后按需补齐 messageCount（用 withCount=true 加载，避免常驻全量开销）
    loadDshSessionCounts();
  }

  /* ================= 层级 2：会话列表 ================= */
  function renderSessionsPage() {
    var ws = state.currentProject;
    if (!ws) return;
    $('sessPageTitle').textContent = ws.title || baseName(ws.path) || '会话';
    var q = state.sessQuery;
    var list = projectSessions(ws).filter(function (s) {
      if (!q) return true;
      return (String(s.title || '').toLowerCase().indexOf(q) > -1) ||
             (String(s.cwd || '').toLowerCase().indexOf(q) > -1);
    });
    var box = $('dshSessList');
    box.textContent = '';
    $('dshSessEmpty').hidden = list.length > 0;

    if (!state.dshOk) {
      box.appendChild(el('div', 'proj-note', '无法加载电脑端 DSH 会话（/api/dsh-sessions 不可用）。'));
      return;
    }
    list.forEach(function (s) {
      var item = el('div', 'sess-item');

      main.appendChild(el('div', 'sess-title', title));
      var meta = String(s.cwd || '');
      if (typeof s.messageCount === 'number' && s.messageCount >= 0) meta += (meta ? ' · ' : '') + s.messageCount + ' 条消息';
      if (s.updatedAt) meta += (meta ? ' · ' : '') + fmtAgo(s.updatedAt);
      main.appendChild(el('div', 'sess-meta', meta));
      main.addEventListener('click', function () { openDshSession(ws, s); });
      item.appendChild(icon);
      item.appendChild(main);
      box.appendChild(item);
    });
