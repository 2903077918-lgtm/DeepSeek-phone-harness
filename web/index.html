<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#0D0D0D">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">

<title>deepseekharness-relay · 控制台</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%234D6BFE'/%3E%3Cstop offset='1' stop-color='%236C8CFF'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='15' fill='url(%23g)'/%3E%3Ctext x='32' y='45' font-size='28' text-anchor='middle' fill='white' font-family='monospace' font-weight='bold'%3E%26gt;_%3C/text%3E%3C/svg%3E">
<style>
  :root {
    --bg: #0D0D0D;
    --bg-2: #111111;
    --card: #1A1A1A;
    --card-2: #202020;
    --bubble: #262626;
    --border: #333333;
    --border-soft: rgba(255, 255, 255, 0.07);
    --text: #F2F2F2;
    --muted: #A3A3A3;
    --faint: #737373;
    --accent: #4D6BFE;
    --accent-2: #6C8CFF;
    --ok: #34C77B;
    --ok-soft: rgba(52, 199, 123, 0.12);
    --err: #F87171;
    --err-soft: rgba(248, 113, 113, 0.12);
    --radius: 16px;
    --radius-sm: 12px;
    --mono: ui-monospace, "Cascadia Code", "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
    --safe-left: env(safe-area-inset-left, 0px);
    --safe-right: env(safe-area-inset-right, 0px);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;
    background:
      radial-gradient(130% 42% at 50% -6%, rgba(77, 107, 254, 0.10), transparent 62%),
      var(--bg);
    color: var(--text);
    overflow: hidden;
    -webkit-tap-highlight-color: transparent;
  }
  :focus-visible { outline: 2px solid var(--accent-2); outline-offset: 2px; }
  button { font-family: inherit; touch-action: manipulation; }
  svg { flex: none; }

  .app {
    height: 100vh;
    height: 100dvh;
    max-width: 760px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    position: relative;
  }
  @media (min-width: 761px) {
    .app { border-left: 1px solid var(--border-soft); border-right: 1px solid var(--border-soft); }
  }

  /* ================= 顶部栏 ================= */
  .topbar {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: calc(var(--safe-top) + 8px) 14px 8px;
    background: rgba(13, 13, 13, 0.86);
    -webkit-backdrop-filter: blur(14px);
    backdrop-filter: blur(14px);
    border-bottom: 1px solid var(--border-soft);
    z-index: 30;
  }
  .conn {
    display: flex;
    align-items: center;
    gap: 8px;
    min-height: 44px;
    max-width: 46vw;
    padding: 0 12px;
    border-radius: 999px;
    border: 1px solid var(--border-soft);
    background: var(--card);
    color: var(--muted);
    cursor: pointer;
    flex: none;
  }
  .conn:active { opacity: 0.8; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--faint); flex: none; }
  .dot.on  { background: var(--ok); box-shadow: 0 0 8px var(--ok); }
  .dot.off { background: var(--err); box-shadow: 0 0 8px var(--err); animation: blink 1.2s ease-in-out infinite; }
  .dot.bad { background: var(--err); box-shadow: 0 0 8px var(--err); }
  .dot.na  { background: var(--faint); }
  .conn-text { display: flex; flex-direction: column; min-width: 0; text-align: left; }
  .conn-label { font-size: 12.5px; font-weight: 600; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .conn-sub { font-size: 10px; color: var(--faint); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  .brand { flex: 1; min-width: 0; text-align: center; }
  .brand-name { font-size: 15.5px; font-weight: 700; letter-spacing: 0.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .brand-sub {
    font-size: 11px; color: var(--faint); margin-top: 1px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    max-width: 52vw; margin-left: auto; margin-right: auto; cursor: pointer;
  }
  .icon-btn {
    display: inline-grid;
    place-items: center;
    width: 44px; height: 44px;
    border-radius: 12px;
    border: 1px solid var(--border-soft);
    background: var(--card);
    color: var(--text);
    cursor: pointer;
    flex: none;
  }
  .icon-btn:active { transform: scale(0.96); }
  .icon-btn-sm { width: 36px; height: 36px; border-radius: 10px; }

  /* 待处理审批徽章（顶栏） */
  .appr-badge {
    display: inline-flex; align-items: center; gap: 5px;
    min-height: 44px; padding: 0 12px; flex: none;
    border-radius: 999px; border: 1px solid rgba(248, 113, 113, 0.45);
    background: rgba(248, 113, 113, 0.12);
    color: var(--text); font-size: 12px; font-weight: 600;
    cursor: pointer; touch-action: manipulation;
  }
  .appr-badge[hidden] { display: none; }
  .appr-badge:active { opacity: 0.8; }
  .appr-badge-count { color: #FCA5A5; font-family: var(--mono); font-size: 13px; font-weight: 700; font-variant-numeric: tabular-nums; }

  /* ================= 对话区 ================= */
  .chat {
    flex: 1;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    display: flex;
    flex-direction: column;
    gap: 14px;
    padding: 16px 14px 14px;
  }
  .chat::-webkit-scrollbar { width: 6px; }
  .chat::-webkit-scrollbar-thumb { background: #2A2A2A; border-radius: 6px; }

  .msg { display: flex; flex-direction: column; gap: 5px; max-width: 86%; }
  .msg.user { align-self: flex-end; align-items: flex-end; }
  .msg.assistant { align-self: flex-start; align-items: flex-start; }

  .bubble { padding: 11px 14px; font-size: 15px; line-height: 1.6; white-space: pre-wrap; word-break: break-word; }
  .bubble.user {
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    color: #FFFFFF;
    border-radius: 16px 16px 4px 16px;
  }
  .bubble.asst {
    background: var(--bubble);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 4px 16px 16px 16px;
  }
  .meta { font-size: 11px; color: var(--faint); padding: 0 4px; }

  /* 助手消息内部 */
  .asst-head { display: flex; align-items: center; gap: 6px; margin-bottom: 8px; flex-wrap: wrap; }
  .asst-name { font-size: 12px; font-weight: 600; color: #8FA3FF; }
  .chip { font-size: 10.5px; font-weight: 600; padding: 2px 8px; border-radius: 999px; letter-spacing: 0.02em; }
  .chip.ok { color: var(--ok); background: var(--ok-soft); }
  .chip.fail { color: var(--err); background: var(--err-soft); }
  .chip.backend { color: var(--muted); background: rgba(255, 255, 255, 0.06); font-family: var(--mono); font-size: 10px; }
  .asst-body { white-space: normal; font-size: 14.5px; max-height: 50vh; overflow-y: auto; }
  .asst-body p { margin: 0 0 8px; }
  .asst-body p:last-child { margin-bottom: 0; }
  .asst-body h2, .asst-body h3, .asst-body h4, .asst-body h5, .asst-body h6 { margin: 10px 0 6px; font-weight: 700; line-height: 1.35; }
  .asst-body h2 { font-size: 16px; } .asst-body h3 { font-size: 15px; } .asst-body h4 { font-size: 14px; }
  .asst-body h5, .asst-body h6 { font-size: 13.5px; }
  .asst-body ul, .asst-body ol { margin: 4px 0 8px; padding-left: 20px; }
  .asst-body li { margin: 3px 0; }
  .asst-body code { font-family: var(--mono); font-size: 12.5px; background: #1A1A1A; border: 1px solid var(--border); border-radius: 6px; padding: 1.5px 5px; color: #9FB4FF; }
  .asst-body pre { background: #1A1A1A; border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; margin: 6px 0 10px; overflow-x: auto; }
  .asst-body pre code { background: none; border: none; padding: 0; color: var(--text); font-size: 12px; line-height: 1.55; display: block; white-space: pre-wrap; word-break: break-word; }
  .asst-body blockquote { margin: 6px 0; padding: 2px 12px; border-left: 3px solid var(--accent); color: var(--muted); }
  .asst-body hr { border: none; border-top: 1px solid var(--border); margin: 10px 0; }
  .asst-body a { color: #8FA3FF; text-decoration: none; }
  .stderr { margin-top: 10px; border: 1px solid rgba(248, 113, 113, 0.35); background: rgba(248, 113, 113, 0.08); border-radius: 10px; padding: 9px 11px; }
  .stderr-lbl { font-size: 11px; font-weight: 600; color: #FCA5A5; margin-bottom: 5px; letter-spacing: 0.04em; }
  .stderr pre { margin: 0; font-family: var(--mono); font-size: 12px; line-height: 1.55; white-space: pre-wrap; word-break: break-word; color: #FCA5A5; max-height: 32vh; overflow: auto; }
  .noout { color: var(--faint); font-size: 13px; padding: 2px 0; }
  .asst-meta { margin-top: 8px; display: flex; gap: 10px; font-size: 11px; color: var(--faint); align-items: center; }

  /* 工具卡片（执行详情） */
  .tool-card { width: 100%; border: 1px solid var(--border); border-radius: var(--radius-sm); background: var(--card); overflow: hidden; margin-left: 8px; }
  .tc-head {
    display: flex; align-items: center; gap: 8px; width: 100%; min-height: 40px;
    padding: 0 12px; background: none; border: none; color: var(--muted);
    font-size: 12.5px; cursor: pointer; text-align: left;
  }
  .tc-head .tc-chev { transition: transform 0.18s ease; }
  .tool-card.open .tc-head .tc-chev { transform: rotate(180deg); }
  .tc-name { font-family: var(--mono); color: var(--text); flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tc-time { font-family: var(--mono); font-size: 11px; color: var(--faint); }
  .tc-body { display: none; border-top: 1px solid var(--border-soft); background: var(--bg-2); }
  .tool-card.open .tc-body { display: block; }
  .tc-row { display: flex; align-items: center; gap: 8px; padding: 8px 12px; border-bottom: 1px solid var(--border-soft); font-size: 11.5px; }
  .tc-k { color: var(--faint); }
  .tc-v { font-family: var(--mono); color: var(--text); }
  .tc-v.ok { color: var(--ok); } .tc-v.err { color: var(--err); }
  .tc-body pre { margin: 0; padding: 10px 12px; font-family: var(--mono); font-size: 12px; line-height: 1.55; white-space: pre-wrap; word-break: break-word; color: var(--muted); max-height: 40vh; overflow: auto; }

  /* 审批卡片（对话流） */
  .appr-card { width: 100%; margin-left: 8px; border: 1px solid var(--border); border-radius: var(--radius-sm); background: var(--card); overflow: hidden; }
  .appr-card.pending { border-color: rgba(77, 107, 254, 0.45); }
  .appr-head { display: flex; align-items: center; gap: 8px; padding: 10px 12px; border-bottom: 1px solid var(--border-soft); }
  .appr-icon { display: grid; place-items: center; flex: none; color: #FBBF24; }
  .appr-card.allowed .appr-icon { color: var(--ok); }
  .appr-card.rejected .appr-icon { color: var(--err); }
  .appr-card.expired .appr-icon { color: var(--faint); }
  .appr-title { flex: 1; min-width: 0; font-size: 13px; font-weight: 700; }
  .appr-time { flex: none; font-family: var(--mono); font-size: 10.5px; color: var(--faint); }
  .appr-chip { flex: none; font-size: 10.5px; font-weight: 600; padding: 2px 8px; border-radius: 999px; }
  .appr-chip.ok { color: var(--ok); background: var(--ok-soft); }
  .appr-chip.err { color: var(--err); background: var(--err-soft); }
  .appr-chip.muted { color: var(--muted); background: rgba(255, 255, 255, 0.06); }
  .appr-body { padding: 10px 12px 12px; }
  .appr-tool {
    font-family: var(--mono); font-size: 13.5px; font-weight: 700; color: var(--text);
    white-space: nowrap; overflow-x: auto; -webkit-overflow-scrolling: touch; padding-bottom: 2px;
  }
  .appr-reason { margin-top: 6px; font-size: 12.5px; color: var(--muted); line-height: 1.55; word-break: break-word; }
  .appr-callid { margin-top: 5px; font-family: var(--mono); font-size: 10.5px; color: var(--faint); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .appr-actions { display: flex; gap: 8px; margin-top: 12px; }
  .appr-btn {
    flex: 1; min-height: 46px; border-radius: 12px; border: none;
    font-size: 15px; font-weight: 600; cursor: pointer; font-family: inherit;
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    touch-action: manipulation; transition: transform 0.06s ease;
  }
  .appr-btn:disabled { opacity: 0.55; cursor: not-allowed; }
  .appr-btn.allow { background: linear-gradient(135deg, var(--accent), var(--accent-2)); color: #fff; }
  .appr-btn.allow:active:not(:disabled) { transform: scale(0.97); }
  .appr-btn.reject { background: none; border: 1px solid var(--border); color: var(--muted); }
  .appr-btn.reject:active:not(:disabled) { transform: scale(0.97); border-color: rgba(248, 113, 113, 0.55); color: #FCA5A5; }
  .appr-result { display: flex; align-items: center; gap: 7px; margin-top: 12px; font-size: 12.5px; color: var(--muted); }
  .appr-result svg { flex: none; }
  .appr-card.flash { animation: apprFlash 1.6s ease; }

  /* 正在执行… */
  .pending-bubble { display: flex; align-items: center; gap: 9px; padding: 13px 16px; }
  .typing { display: flex; gap: 4px; }
  .tdot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent-2); animation: breathe 1.2s ease-in-out infinite; }
  .tdot:nth-child(2) { animation-delay: 0.15s; }
  .tdot:nth-child(3) { animation-delay: 0.3s; }
  .pending-text { font-size: 13px; color: var(--muted); }
  .pending-clock { font-family: var(--mono); font-size: 12px; color: var(--faint); }

  /* 欢迎页 */
  .welcome { margin: auto; text-align: center; padding: 20px 8px; display: flex; flex-direction: column; align-items: center; gap: 12px; color: var(--faint); }
  .w-logo {
    width: 62px; height: 62px; border-radius: 18px;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    display: grid; place-items: center; color: #fff; font-weight: 800; font-size: 24px;
    font-family: var(--mono);
  }
  .w-title { font-size: 16px; font-weight: 700; color: var(--text); }
  .w-sub { font-size: 13px; line-height: 1.6; max-width: 300px; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
  .chip-ex {
    padding: 8px 14px; border-radius: 999px; border: 1px solid var(--border);
    background: var(--card); color: var(--muted); font-size: 12.5px; cursor: pointer;
  }
  .chip-ex:active { transform: scale(0.97); border-color: var(--accent); color: var(--text); }

  /* ================= 底部输入栏 ================= */
  .inputbar {
    border-top: 1px solid var(--border-soft);
    background: rgba(13, 13, 13, 0.92);
    -webkit-backdrop-filter: blur(14px);
    backdrop-filter: blur(14px);
    padding: 8px calc(12px + var(--safe-right)) calc(var(--safe-bottom) + 8px) calc(12px + var(--safe-left));
    z-index: 30;
  }
  .ibar-inner { display: flex; align-items: flex-end; gap: 8px; max-width: 680px; margin: 0 auto; }
  #input {
    flex: 1; min-width: 0;
    min-height: 44px; max-height: 120px;
    resize: none;
    background: var(--bubble);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 22px;
    padding: 11px 16px;
    font-size: 16px; /* 防 iOS 聚焦缩放 */
    line-height: 1.45;
    font-family: inherit;
    outline: none;
    transition: border-color 0.15s ease;
  }
  #input::placeholder { color: var(--faint); }
  #input:focus { border-color: var(--accent); }
  #sendBtn {
    flex: none;
    width: 46px; height: 46px;
    border-radius: 50%;
    border: none;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    color: #fff;
    display: grid; place-items: center;
    cursor: pointer;
    transition: transform 0.06s ease, filter 0.15s ease;
  }
  #sendBtn:active:not(:disabled) { transform: scale(0.94); }
  #sendBtn:disabled { background: #2A2A2A; color: var(--faint); cursor: not-allowed; }

  /* ================= 抽屉（底部面板） ================= */
  .scrim {
    position: fixed; inset: 0; z-index: 40;
    background: rgba(0, 0, 0, 0.55);
    -webkit-backdrop-filter: blur(2px); backdrop-filter: blur(2px);
    opacity: 0; pointer-events: none; transition: opacity 0.22s ease;
  }
  .scrim.show { opacity: 1; pointer-events: auto; }
  .drawer {
    position: fixed; bottom: 0; left: 0; right: 0; margin: 0 auto;
    max-width: 520px;
    z-index: 41;
    background: #141414;
    border: 1px solid var(--border);
    border-bottom: none;
    border-radius: 20px 20px 0 0;
    max-height: 86dvh;
    transform: translateY(100%);
    transition: transform 0.28s cubic-bezier(0.32, 0.72, 0.28, 1);
    display: flex; flex-direction: column;
    padding-bottom: var(--safe-bottom);
  }
  .drawer.show { transform: translateY(0); }
  .drawer-grip { width: 40px; height: 4px; border-radius: 4px; background: #2E2E2E; margin: 8px auto 0; flex: none; }
  .drawer-head { display: flex; align-items: center; justify-content: space-between; padding: 10px 14px 6px; flex: none; }
  .drawer-title { font-size: 16px; font-weight: 700; }
  .drawer-body { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 4px 12px 16px; }

  .dsec { margin-top: 16px; }
  .dsec:first-child { margin-top: 6px; }
  .dsec-title {
    display: flex; align-items: center; gap: 8px;
    margin: 0 4px 8px; font-size: 12px; font-weight: 600; color: var(--faint);
    letter-spacing: 0.05em;
  }
  .dsec-count { font-weight: 500; }
  .dsec-note { margin: 8px 4px 0; font-size: 11px; color: var(--faint); line-height: 1.5; }
  .dsec-empty { padding: 18px 0; text-align: center; font-size: 12.5px; color: var(--faint); }

  /* 会话列表 */
  .sess-item { display: flex; align-items: center; gap: 4px; border: 1px solid var(--border-soft); border-radius: var(--radius-sm); background: var(--card); margin-bottom: 8px; overflow: hidden; }
  .sess-item.active { border-color: rgba(77, 107, 254, 0.55); background: rgba(77, 107, 254, 0.08); }
  .sess-main { flex: 1; min-width: 0; padding: 10px 12px; cursor: pointer; }
  .sess-title { font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .sess-meta { font-size: 11px; color: var(--faint); margin-top: 2px; }
  .sess-del {
    flex: none; width: 44px; height: 44px; margin-right: 4px;
    background: none; border: none; color: var(--faint);
    display: grid; place-items: center; border-radius: 10px; font-size: 12px;
  }
  .sess-del.confirm { color: var(--err); background: rgba(248, 113, 113, 0.14); font-weight: 700; }
  .new-sess-btn {
    display: flex; align-items: center; justify-content: center; gap: 7px;
    width: 100%; min-height: 44px;
    border-radius: var(--radius-sm);
    border: 1px dashed rgba(77, 107, 254, 0.45);
    background: rgba(77, 107, 254, 0.08);
    color: #8FA3FF; font-size: 14px; font-weight: 600; cursor: pointer;
  }
  .new-sess-btn:active { transform: scale(0.99); }

  /* 全局记录 */
  .gh-item { border: 1px solid var(--border-soft); border-radius: var(--radius-sm); background: var(--card); margin-bottom: 8px; overflow: hidden; }
  .gh-head {
    display: flex; align-items: center; gap: 8px; width: 100%;
    padding: 10px 12px; background: none; border: none; color: var(--text);
    font-size: 13px; cursor: pointer; text-align: left; font-family: inherit;
  }
  .gh-task { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--muted); }
  .gh-time { flex: none; font-size: 11px; color: var(--faint); font-variant-numeric: tabular-nums; }
  .gh-detail { padding: 2px 12px 12px; border-top: 1px dashed var(--border-soft); }
  .gh-lbl { margin-top: 10px; font-size: 11px; font-weight: 600; letter-spacing: 0.04em; color: var(--faint); }
  .gh-detail pre {

    display: inline-flex; align-items: center; gap: 6px;

  /* ================= 令牌弹窗 ================= */
  .overlay {
    position: fixed; inset: 0; z-index: 50;
    background: rgba(0, 0, 0, 0.6);

    width: 100%; max-width: 380px;
    background: var(--card); border: 1px solid var(--border);

  .ov-title { font-size: 17px; font-weight: 700; margin-bottom: 6px; }
  .ov-hint { font-size: 12.5px; color: var(--faint); line-height: 1.5; margin: 0 0 14px; }
  .token-row { display: flex; gap: 8px; }
  .token-row .input { flex: 1; min-width: 0; }
  .input {
    display: block; width: 100%;
    background: var(--card-2); color: var(--text);
    border: 1px solid var(--border); border-radius: 12px;
    padding: 12px 14px; font-size: 16px; font-family: inherit; outline: none;
    transition: border-color 0.15s ease;
  }
  .input::placeholder { color: var(--faint); }
  .input:focus { border-color: var(--accent); }
  .mono { font-family: var(--mono); }
  .ov-actions { display: flex; gap: 8px; margin-top: 14px; }
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;

  }
  .btn.primary { background: linear-gradient(135deg, var(--accent), var(--accent-2)); color: #fff; flex: 1; }
  .btn.ghost { background: none; border: 1px solid var(--border); color: var(--muted); }
  .btn.full { width: 100%; margin-top: 10px; }

  /* ================= Toast ================= */
  .toast {
    position: fixed; left: 50%;
    bottom: calc(var(--safe-bottom) + 84px);

  @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }

    * { animation: none !important; transition: none !important; }
  }

<script>
(function () {
  'use strict';

  /* ================= 常量与工具 ================= */
  var $ = function (id) { return document.getElementById(id); };
  var LS_TOKEN = 'ph_token';
  var LS_SESSIONS = 'ph_sessions';
  var LS_PREFIX = 'ph_msgs_';
  var STATUS_INTERVAL = 8000;   // /api/status 心跳
  var HISTORY_LIMIT = 30;

  var state = {
    token: localStorage.getItem(LS_TOKEN) || '',
    sessions: [],        // [{id, title, createdAt, lastUsedAt, serverSessionId?}]
    currentId: null,
    running: false,      // 是否正在执行
    runSid: null,        // 正在执行所属会话
    runStart: 0,
    runTimer: null,
    serverSessions: false, // 后端是否支持 /api/sessions（探测结果）
    status: null,
    globalHistory: [],
    pendingApprovals: [], // 后端待处理审批 [{approvalId, sessionId, toolName, reason?, callId?, receivedAt}]
    _approvalBusy: false
  };

  var ICON_GEAR = '<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>';
  var ICON_CHEV = '<svg class="tc-chev" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>';
  var ICON_TRASH = '<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></svg>';
  var ICON_EYE = '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>';
  var ICON_EYE_OFF = '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>';
  var ICON_SHIELD = '<svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>';

  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text !== undefined) n.textContent = text;
    return n;
  }
  function uid() { return 's-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 10); }
  function hasText(s) { return typeof s === 'string' && s.trim().length > 0; }
  function escHtml(s) {
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }
  function firstLine(s, n) {
    var t = String(s || '').split('\n')[0].trim();
    if (!t) return '（空任务）';
    return t.length > n ? t.slice(0, n) + '…' : t;
  }
  function fmtElapsed(ms) {
    if (typeof ms !== 'number' || isNaN(ms)) return '—';
    var s = ms / 1000;
    if (s < 60) return s.toFixed(1) + ' 秒';
    var m = Math.floor(s / 60);
    var sec = Math.round(s % 60);
    return m + ' 分 ' + sec + ' 秒';
  }
  function fmtTime(iso, withSec) {
    if (!iso) return '';
    var d = new Date(iso);
    if (isNaN(d.getTime())) return '';
    var opt = { hour12: false, month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit' };
    if (withSec) opt.second = '2-digit';
    try { return d.toLocaleString('zh-CN', opt); } catch (e) { return ''; }
  }
  function httpErr(msg, code) { var e = new Error(msg); e.code = code; return e; }

  /* ================= API ================= */
  async function api(path, opts) {
    opts = opts || {};
    var headers = { authorization: 'Bearer ' + state.token };
    if (opts.body) headers['content-type'] = 'application/json';
    if (opts.headers) Object.assign(headers, opts.headers);
    var ctrl = null, timer = null;
    if (opts.timeoutMs) {
      ctrl = new AbortController();
      timer = setTimeout(function () { ctrl.abort(); }, opts.timeoutMs);
    }
    var r;
    try {
      r = await fetch(path, {
        method: opts.method || 'GET',
        body: opts.body,
        headers: headers,
        signal: ctrl ? ctrl.signal : undefined
      });
    } catch (e) {
      if (e && e.name === 'AbortError') throw httpErr('请求超时，请检查网络与 Agent 状态', 'NET');
      throw httpErr('无法连接 Agent，请确认电脑端已启动且与手机在同一网络', 'NET');
    } finally {
      if (timer) clearTimeout(timer);
    }
    var data = null;
    try { data = await r.json(); } catch (e) { /* 非 JSON 响应 */ }
    if (r.status === 401) throw httpErr('令牌无效，请检查 Token', 401);
    if (!r.ok) throw httpErr((data && data.error) || '请求失败（HTTP ' + r.status + '）', r.status);
    return data;
  }

  /* ================= 会话存储（本地） ================= */
  function loadSessions() { try { return JSON.parse(localStorage.getItem(LS_SESSIONS) || '[]'); } catch (e) { return []; } }
  function saveSessions() { localStorage.setItem(LS_SESSIONS, JSON.stringify(state.sessions)); }
  function loadMsgs(sid) { try { return JSON.parse(localStorage.getItem(LS_PREFIX + sid) || '[]'); } catch (e) { return []; } }
  function saveMsgs(sid, msgs) { localStorage.setItem(LS_PREFIX + sid, JSON.stringify(msgs)); }
  function newSessionObj() {
    return { id: uid(), title: '新会话', createdAt: new Date().toISOString(), lastUsedAt: new Date().toISOString() };
  }
  function ensureSession() {
    if (state.currentId && state.sessions.some(function (s) { return s.id === state.currentId; })) return state.currentId;
    if (!state.sessions.length) { state.sessions.push(newSessionObj()); saveSessions(); }
    state.currentId = state.sessions[0].id;
    return state.currentId;
  }
  function touchSession(id) {
    var s = state.sessions.find(function (x) { return x.id === id; });
    if (s) { s.lastUsedAt = new Date().toISOString(); saveSessions(); }
  }
  function newSession() {
    var s = newSessionObj();
    state.sessions.unshift(s);
    saveSessions();
    switchSession(s.id);
    return s.id;
  }
  function switchSession(id) {
    if (!state.sessions.some(function (s) { return s.id === id; })) return;
    state.currentId = id;
    touchSession(id);
    renderMessages('bottom');
    renderSessionList();
    updateBrandSub();
    closeDrawer();
  }
  function deleteSession(id) {
    localStorage.removeItem(LS_PREFIX + id);
    state.sessions = state.sessions.filter(function (s) { return s.id !== id; });
    if (!state.sessions.length) state.sessions.push(newSessionObj());
    saveSessions();
    if (!state.sessions.some(function (s) { return s.id === state.currentId; })) {
      state.currentId = state.sessions[0].id;
    }
    renderSessionList();
    renderMessages('bottom');
    updateBrandSub();
  }
  function updateBrandSub() {
    var s = state.sessions.find(function (x) { return x.id === state.currentId; });
    $('sessionTitle').textContent = s ? (s.title || '新会话') : '新会话';
  }

  /* ================= Markdown 简单渲染（先转义再解析，安全） ================= */
  function inlineMd(s) {
    return s
      .replace(/`([^`]+)`/g, function (m, c) { return '<code>' + c + '</code>'; })
      .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
      .replace(/(^|[^[])\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g, '$1<a href="$3" target="_blank" rel="noopener">$2</a>')
      .replace(/(^|\s)(https?:\/\/[^\s<]+[^\s<.,;:!?)\]])/g, '$1<a href="$2" target="_blank" rel="noopener">$2</a>');
  }
  function renderMarkdown(src) {
    var esc = escHtml(String(src || ''));
    var lines = esc.split('\n');
    var html = '';
    var codeBuf = [];
    var inCode = false;
    var inList = null;
    var listBuf = [];

    function flushList() {
      if (!inList) return;
      html += '<' + inList + '>' + listBuf.join('') + '</' + inList + '>';
      listBuf = [];
      inList = null;
    }
    function flushCode() {
      html += '<pre><code>' + codeBuf.join('\n') + '</code></pre>';
      codeBuf = [];
    }

    for (var i = 0; i < lines.length; i++) {
      var line = lines[i];
      var fence = /^(`{3,}|~{3,})/.exec(line);
      if (fence) {
        flushList();
        if (inCode) { flushCode(); inCode = false; }
        else { inCode = true; codeBuf = []; }
        continue;
      }
      if (inCode) { codeBuf.push(line); continue; }
      var t = line.trim();
      if (!t) { flushList(); continue; }
      if (/^(-{3,}|\*{3,}|_{3,})$/.test(t)) { flushList(); html += '<hr>'; continue; }
      var h = /^(#{1,4})\s+(.*)$/.exec(t);
      if (h) {
        flushList();
        var lvl = Math.min(h[1].length + 1, 6);
        html += '<h' + lvl + '>' + inlineMd(h[2]) + '</h' + lvl + '>';
        continue;
      }
      if (t.indexOf('&gt;') === 0) { flushList(); html += '<blockquote>' + inlineMd(t.replace(/^&gt;\s?/, '')) + '</blockquote>'; continue; }
      var ul = /^[-*•]\s+(.*)$/.exec(t);
      var ol = /^\d+[.)]\s+(.*)$/.exec(t);
      if (ul || ol) {
        var type = ul ? 'ul' : 'ol';
        if (inList && inList !== type) flushList();
        if (!inList) { inList = type; listBuf = []; }
        listBuf.push('<li>' + inlineMd((ul ? ul[1] : ol[1])) + '</li>');
        continue;
      }
      flushList();
      html += '<p>' + inlineMd(t) + '</p>';
    }
    flushList();
    if (inCode) flushCode();
    return html;
  }

  function scrollBottom(smooth) {
    var c = $('chat');
    c.scrollTo({ top: c.scrollHeight, behavior: smooth ? 'smooth' : 'auto' });
  }
  function scrollIfNear() {
    var c = $('chat');
    if (c.scrollHeight - c.scrollTop - c.clientHeight < 140) c.scrollTop = c.scrollHeight;
  }
  function renderMessages(scroll) {
    var chat = $('chat');
    var sid = ensureSession();
    var msgs = loadMsgs(sid);
    chat.textContent = '';
    if (!msgs.length && !(state.running && state.runSid === sid)) {
      chat.appendChild(welcomeEl());
      return;
    }
    msgs.forEach(function (m) {
      if (m.role === 'approval') chat.appendChild(approvalEl(m));
      else chat.appendChild(m.role === 'user' ? userEl(m) : asstEl(m));
    });
    if (state.running && state.runSid === sid) chat.appendChild(pendingEl());
    if (scroll === 'bottom') scrollBottom(false);
    else if (scroll === 'smooth') scrollBottom(true);
    else if (scroll === 'ifNear') scrollIfNear();
  }

  /* ================= 审批（授权请求） ================= */
  var APPROVAL_INTERVAL = 5000; // 待处理审批轮询

    var wrap = el('div', 'msg assistant');
    wrap.appendChild(approvalCardEl(m));

  }

  function approvalCardEl(m) {
    var status = m.status || 'pending';
    var card = el('div', 'appr-card ' + status);

    var head = el('div', 'appr-head');
    var icon = el('span', 'appr-icon');
    icon.innerHTML = ICON_SHIELD;
    head.appendChild(icon);
    var title = status === 'pending' || status === 'processing' ? '需要授权'
      : (status === 'allowed' ? '已允许' : (status === 'rejected' ? '已拒绝' : '已处理'));
    head.appendChild(el('span', 'appr-title', title));
    if (status === 'allowed') head.appendChild(el('span', 'appr-chip ok', '✓ 已允许'));
    else if (status === 'rejected') head.appendChild(el('span', 'appr-chip err', '✗ 已拒绝'));
    else if (status === 'expired') head.appendChild(el('span', 'appr-chip muted', '已处理'));
    head.appendChild(el('span', 'appr-time', fmtTime(m.receivedAt || m.at)));
    card.appendChild(head);

    var body = el('div', 'appr-body');
    body.appendChild(el('div', 'appr-tool', m.toolName || '未知工具'));
    if (hasText(m.reason)) body.appendChild(el('div', 'appr-reason', m.reason));
    if (hasText(m.callId)) body.appendChild(el('div', 'appr-callid', 'callId: ' + m.callId));

    if (status === 'pending' || status === 'processing') {
      var actions = el('div', 'appr-actions');
      var busy = status === 'processing';
      var allowBtn = el('button', 'appr-btn allow', busy ? '处理中…' : '允许一次');
      allowBtn.type = 'button';
      allowBtn.disabled = busy;
      allowBtn.addEventListener('click', function () { decideApproval(m, 'allowed-once'); });
      var rejectBtn = el('button', 'appr-btn reject', busy ? '处理中…' : '拒绝');
      rejectBtn.type = 'button';
      rejectBtn.disabled = busy;
      rejectBtn.addEventListener('click', function () { decideApproval(m, 'rejected'); });
      actions.appendChild(allowBtn);
      actions.appendChild(rejectBtn);
      body.appendChild(actions);
    } else {
      var res = el('div', 'appr-result');
      res.innerHTML = ICON_SHIELD;
      var label = status === 'allowed' ? '已允许，任务继续执行'
        : (status === 'rejected' ? '已拒绝本次操作' : '该审批已在其他端处理');
      if (m.decidedAt) label += ' · ' + fmtTime(m.decidedAt);
      res.appendChild(document.createTextNode(label));
      body.appendChild(res);
    }
    card.appendChild(body);
    return card;
  }

  async function decideApproval(m, outcome) {
    if (!m || m.status === 'processing' || m.status === 'allowed' ||
        m.status === 'rejected' || m.status === 'expired') return;
    var sid = m.sid || mapApprovalSessionId(m.sessionId);
    var msgs = loadMsgs(sid);
    var idx = msgs.findIndex(function (x) { return x.id === m.id; });
    if (idx === -1) return;
    msgs[idx].status = 'processing';
    saveMsgs(sid, msgs);
    renderMessages('ifNear');

    try {
      var r = await api('/api/approvals', {
        method: 'POST',
        body: JSON.stringify({ approvalId: m.approvalId, outcome: outcome }),
        timeoutMs: 8000
      });
      msgs = loadMsgs(sid);
      idx = msgs.findIndex(function (x) { return x.id === m.id; });
      if (idx === -1) return;
      if (r && r.ok && r.accepted !== false) {
        msgs[idx].status = outcome === 'allowed-once' ? 'allowed' : 'rejected';
        msgs[idx].decidedAt = new Date().toISOString();
        saveMsgs(sid, msgs);
        renderMessages('ifNear');
        toast(outcome === 'allowed-once' ? '已允许，任务继续执行' : '已拒绝');
      } else if (r && r.ok) {
        msgs[idx].status = 'expired';
        msgs[idx].decidedAt = new Date().toISOString();
        saveMsgs(sid, msgs);
        renderMessages('ifNear');
        toast('该审批已被处理，无需重复操作');
      } else {
        msgs[idx].status = 'pending';
        saveMsgs(sid, msgs);
        renderMessages('ifNear');
        toast('审批提交失败', 'err');
      }
      refreshApprovals(); // 立即同步徽章
    } catch (e) {
      msgs = loadMsgs(sid);
      idx = msgs.findIndex(function (x) { return x.id === m.id; });
      if (idx > -1) {
        msgs[idx].status = 'pending';
        saveMsgs(sid, msgs);
        renderMessages('ifNear');
      }
      if (e.code === 401) {
        toast('令牌无效，请检查 Token', 'err');
        openTokenOverlay('令牌无效，请重新输入');
      } else {
        toast(e.message || '审批提交失败', 'err');
      }
    }
  }

  function mapApprovalSessionId(sid) {
    if (sid) {
      if (state.sessions.some(function (s) { return s.id === sid; })) return sid;
      var s = state.sessions.find(function (x) { return x.serverSessionId === sid; });
      if (s) return s.id;
    }
    return state.currentId;
  }

  function insertApprovalMessage(item) {
    var aid = item && item.approvalId;
    if (!aid) return;
    var sid = mapApprovalSessionId(item.sessionId);
    var msgs = loadMsgs(sid);
    var mid = 'appr-' + aid;
    if (msgs.some(function (m) { return m.id === mid; })) return; // 幂等：已插入过
    msgs.push({
      id: mid,
      role: 'approval',
      approvalId: aid,
      sid: sid,
      sessionId: item.sessionId || null,
      toolName: item.toolName || '未知工具',
      reason: item.reason || '',
      callId: item.callId || '',
      receivedAt: item.receivedAt || new Date().toISOString(),
      status: 'pending',
      at: item.receivedAt || new Date().toISOString()
    });
    saveMsgs(sid, msgs);
    if (sid === state.currentId) renderMessages('ifNear');
  }

  async function refreshApprovals() {
    if (!state.token) { updateApprovalBadge(0); return; }
    if (state._approvalBusy) return;
    state._approvalBusy = true;
    try {
      var r = await api('/api/approvals', { timeoutMs: 6000 });
      var items = (r && r.items) || [];
      state.pendingApprovals = items;
      updateApprovalBadge(items.length);
      items.forEach(insertApprovalMessage);
    } catch (e) {
      updateApprovalBadge(0);
      // 静默：连接/接口状态由心跳提示
    } finally {
      state._approvalBusy = false;
    }
  }

  function updateApprovalBadge(n) {
    $('apprBadgeCount').textContent = n;
    $('apprBadge').hidden = !(n > 0);
  }

  function ensureApprovalPoll() {
    if (!state._approvalTimer) state._approvalTimer = setInterval(refreshApprovals, APPROVAL_INTERVAL);
  }

  function scrollToPendingApproval() {
    var chat = $('chat');
    var card = chat.querySelector('.appr-card.pending');
    if (!card) {
      for (var i = 0; i < state.sessions.length; i++) {
        var s = state.sessions[i];
        if (s.id === state.currentId) continue;
        if (loadMsgs(s.id).some(function (m) { return m.role === 'approval' && m.status === 'pending'; })) {
          switchSession(s.id);
          break;
        }
      }
      card = $('chat').querySelector('.appr-card.pending');
    }
    if (card) {
      card.scrollIntoView({ behavior: 'smooth', block: 'center' });
      card.classList.add('flash');
      setTimeout(function () { card.classList.remove('flash'); }, 1600);
    }
  }

  function pendingEl() {

    var t = el('span', 'typing');
    t.innerHTML = '<span class="tdot"></span><span class="tdot"></span><span class="tdot"></span>';
    b.appendChild(t);

  /* ================= 发送与执行 ================= */
  function updateInputLock() {
    $('sendBtn').disabled = state.running;
    $('input').readOnly = state.running;
    $('input').placeholder = state.running ? '上一条任务执行中…' : '输入任务，交给电脑上的 DSH…';
  }
  function startRunClock() {
    state.runStart = Date.now();
    clearInterval(state.runTimer);
    state.runTimer = setInterval(function () {
      var c = $('pendingClock');
      if (c) c.textContent = ((Date.now() - state.runStart) / 1000).toFixed(1) + 's';
    }, 100);
  }
  function stopRunClock() { clearInterval(state.runTimer); state.runTimer = null; }

  async function sendMessage() {
    var input = $('input');
    var text = input.value.trim();
    if (!text) { toast('请输入任务内容', 'err'); input.focus(); return; }
    if (state.running) { toast('上一条任务仍在执行中'); return; }
    if (!state.token) { openTokenOverlay('发送前需要先设置访问令牌'); return; }

    var sid = ensureSession();
    var userMsg = { id: uid(), role: 'user', text: text, at: new Date().toISOString() };
    var msgs = loadMsgs(sid);
    msgs.push(userMsg);
    saveMsgs(sid, msgs);
    var s = state.sessions.find(function (x) { return x.id === sid; });
    if (s && msgs.length === 1) { s.title = firstLine(text, 22); saveSessions(); }

    input.value = '';
    autoGrow(input);
    state.running = true;
    state.runSid = sid;
    updateInputLock();
    startRunClock();
    renderMessages('smooth');
    renderSessionList();
    updateBrandSub();

    var body = { task: text, sessionId: sid };
    try {
      // 若后端支持会话：创建/复用服务端会话（当前版本后端会忽略 sessionId，向前兼容）
      if (state.serverSessions) {
        if (s && !s.serverSessionId) {
          try {
            var cr = await api('/api/sessions', { method: 'POST', timeoutMs: 6000 });
            if (cr && cr.sessionId) { s.serverSessionId = cr.sessionId; saveSessions(); body.sessionId = cr.sessionId; }
          } catch (e) { /* 创建失败则继续用本地 id */ }
        } else if (s && s.serverSessionId) {
          body.sessionId = s.serverSessionId;
        }
      }
      var resp = await api('/api/exec', { method: 'POST', body: JSON.stringify(body) });
      var r = (resp && resp.result) || {};
      if (r.sessionId && s && !s.serverSessionId) { s.serverSessionId = r.sessionId; saveSessions(); }

      var asstMsg = {
        id: uid(), role: 'assistant',
        text: r.stdout || '',
        stderr: r.stderr || '',
        ok: !!r.ok,
        exitCode: r.exitCode,
        elapsedMs: r.elapsedMs,
        backend: r.backend || 'relay',
        sessionId: r.sessionId || sid,
        at: new Date().toISOString()
      };
      msgs = loadMsgs(sid);
      msgs.push(asstMsg);
      saveMsgs(sid, msgs);

      state.running = false;
      state.runSid = null;
      stopRunClock();
      updateInputLock();
      renderMessages('ifNear');
      renderSessionList();
      refreshGlobalHistory(true); // 静默刷新全局记录
    } catch (e) {
      state.running = false;
      state.runSid = null;
      stopRunClock();
      updateInputLock();
      if (e.code === 401) {
        toast('令牌无效，请检查 Token', 'err');
        openTokenOverlay('令牌无效，请重新输入');
      } else {
        toast(e.message || '执行失败', 'err');
      }
      msgs = loadMsgs(sid);
      msgs.push({
        id: uid(), role: 'assistant', text: '', stderr: e.message || '执行失败',
        ok: false, exitCode: null, elapsedMs: 0, backend: 'relay', sessionId: sid,
        at: new Date().toISOString(), interrupted: true
      });
      saveMsgs(sid, msgs);
      renderMessages('bottom');
      renderSessionList();
    }
  }

  function autoGrow(ta) {
    ta.style.height = 'auto';
    ta.style.height = Math.min(ta.scrollHeight, 120) + 'px';
  }

  /* ================= 连接状态 ================= */
  function setConn(kind, label, sub) {
    $('dot').className = 'dot ' + kind;
    $('connLabel').textContent = label;
    $('connSub').textContent = sub || '';
  }
  async function refreshStatus(showDetail) {
    if (!state.token) { setConn('na', '未设置 Token', '点击管理令牌'); return; }
    try {
      var resp = await api('/api/status', { timeoutMs: 6000 });
      state.status = resp;
      var label = (resp.agent || 'Agent') + (resp.version ? ' · v' + resp.version : '');
      var sub = resp.time ? fmtTime(resp.time) : '';
      if (resp.pending > 0) sub += (sub ? ' · ' : '') + '队列 ' + resp.pending;
      setConn('on', label, sub);
      renderSettingsStatus();
    } catch (e) {
      if (e.code === 401) {
        setConn('bad', 'Token 无效');
        if (showDetail) openTokenOverlay('令牌无效，请重新输入');
      } else {
        setConn('off', '连接断开', '自动重试中…');
      }
    }
  }
  async function probeSessions() {
    if (!state.token) return;
    try {
      var r = await api('/api/sessions', { timeoutMs: 4000 });
      state.serverSessions = !!(r && r.ok);
    } catch (e) {
      state.serverSessions = false;
    }
    renderSettingsStatus();
  }
  function ensureHeartbeat() {
    if (!state._hb) state._hb = setInterval(refreshStatus, STATUS_INTERVAL);
  }
  function bootConnectivity() {
    ensureHeartbeat();
    ensureApprovalPoll();
    refreshStatus(false);
    probeSessions();
    refreshGlobalHistory(true);
    refreshApprovals();
  }

  /* ================= 全局记录 ================= */
  async function refreshGlobalHistory(silent) {
    if (!state.token) return;
    try {
      var r = await api('/api/history', { timeoutMs: 6000 });
      state.globalHistory = (r && r.items) || [];
      renderGlobalHistory();
    } catch (e) { /* 静默：连接状态由心跳提示 */ }
  }
  function renderGlobalHistory() {
    var box = $('ghList');
    var empty = $('ghEmpty');
    box.textContent = '';
    var items = state.globalHistory.slice(0, HISTORY_LIMIT);
    empty.hidden = items.length > 0;
    if (!items.length) return;
    var total = state.globalHistory.length;
    $('ghCount').textContent = total > HISTORY_LIMIT ? '最近 ' + HISTORY_LIMIT + ' / ' + total : '共 ' + total;
    items.forEach(function (h) { box.appendChild(ghItem(h)); });
  }
  function ghItem(h) {
    var art = el('div', 'gh-item');
    var head = document.createElement('button');
    head.type = 'button';
    head.className = 'gh-head';
    head.setAttribute('aria-expanded', 'false');
    var chip = el('span', 'chip ' + (h.ok ? 'ok' : 'fail'), h.ok ? '✓' : '✗');
    var task = el('span', 'gh-task', firstLine(h.task, 42));
    var time = el('span', 'gh-time', fmtTime(h.at));
    head.appendChild(chip);
    head.appendChild(task);
    head.appendChild(time);

    var det = el('div', 'gh-detail');
    det.hidden = true;
    if (hasText(h.stderr)) {
      det.appendChild(el('div', 'gh-lbl', '错误输出 stderr'));
      det.appendChild(ghPre(h.stderr, true));
    }
    if (hasText(h.stdout)) {
      det.appendChild(el('div', 'gh-lbl', '标准输出 stdout'));
      det.appendChild(ghPre(h.stdout, false));
    }
    if (!hasText(h.stdout) && !hasText(h.stderr)) {
      det.appendChild(el('div', 'noout', '（无输出）'));
    }
    head.addEventListener('click', function () {
      det.hidden = !det.hidden;
      head.setAttribute('aria-expanded', String(!det.hidden));
    });
    art.appendChild(head);
    art.appendChild(det);
    return art;
  }
  function ghPre(content, isErr) {
    var pre = el('pre', isErr ? 'err' : '');
    pre.textContent = content;
    return pre;
  }

  /* ================= 抽屉 ================= */
  function openDrawer() {
    $('drawer').classList.add('show');
    $('scrim').classList.add('show');
    $('drawer').setAttribute('aria-hidden', 'false');
    renderSessionList();
    renderGlobalHistory();
    renderSettingsStatus();
  }
  function closeDrawer() {
    $('drawer').classList.remove('show');
    $('scrim').classList.remove('show');
    $('drawer').setAttribute('aria-hidden', 'true');
  }
  function renderSessionList() {
    var box = $('sessList');
    box.textContent = '';
    if (!state.sessions.length) { ensureSession(); }
    state.sessions.forEach(function (s) {
      var item = el('div', 'sess-item' + (s.id === state.currentId ? ' active' : ''));
      var main = el('div', 'sess-main');
      main.appendChild(el('div', 'sess-title', s.title || '新会话'));
      var cnt = loadMsgs(s.id).length;
      main.appendChild(el('div', 'sess-meta', (cnt ? cnt + ' 条消息 · ' : '') + fmtTime(s.lastUsedAt || s.createdAt)));
      main.addEventListener('click', function () { switchSession(s.id); });
      var del = document.createElement('button');
      del.type = 'button';
      del.className = 'sess-del';
      del.setAttribute('aria-label', '删除会话');
      del.innerHTML = ICON_TRASH;
      del.addEventListener('click', function () { confirmDelete(del, s.id); });
      item.appendChild(main);
      item.appendChild(del);
      box.appendChild(item);
    });
  }
  function confirmDelete(btn, id) {
    if (btn.classList.contains('confirm')) {
      btn.classList.remove('confirm');
      btn.innerHTML = ICON_TRASH;
      clearTimeout(btn._t);
      deleteSession(id);
      toast('会话已删除');
      return;
    }
    btn.classList.add('confirm');
    btn.textContent = '确认';
    clearTimeout(btn._t);
    btn._t = setTimeout(function () {
      btn.classList.remove('confirm');
      btn.innerHTML = ICON_TRASH;
    }, 2500);
  }
  function renderSettingsStatus() {
    var s = state.status || {};
    $('stAgent').textContent = s.agent || '—';
    $('stVer').textContent = s.version ? 'v' + s.version : '—';
    $('stTime').textContent = s.time ? fmtTime(s.time, true) : '—';
    $('stQueue').textContent = typeof s.pending === 'number' ? String(s.pending) : '—';
    $('stMode').textContent = state.serverSessions ? '服务端会话' : '本地会话（后端暂无 /api/sessions）';
  }

  /* ================= 令牌 ================= */
  function openTokenOverlay(hint) {
    $('tokenHint').textContent = hint || '输入电脑端 Agent 启动日志中打印的访问令牌';
    $('tokenInput').value = state.token;
    $('tokenOverlay').classList.add('show');
    setTimeout(function () { $('tokenInput').focus(); }, 120);
  }
  function closeTokenOverlay() { $('tokenOverlay').classList.remove('show'); }
  function toggleTokenVisible() {
    var input = $('tokenInput');
    var show = input.type === 'password';
    input.type = show ? 'text' : 'password';
    $('tokenToggle').setAttribute('aria-pressed', String(show));
    $('tokenToggle').innerHTML = show ? ICON_EYE_OFF : ICON_EYE;
  }
  function saveTokenFromOverlay() {
    var v = $('tokenInput').value.trim();
    if (!v) { toast('请输入令牌', 'err'); $('tokenInput').focus(); return; }
    state.token = v;
    localStorage.setItem(LS_TOKEN, v);
    closeTokenOverlay();
    bootConnectivity();
    if (state.running) { toast('令牌已更新，将在下次任务生效'); }
    else { toast('令牌已保存，正在连接…'); }
  }
  function clearToken() {
    state.token = '';
    localStorage.removeItem(LS_TOKEN);
    closeTokenOverlay();
    setConn('na', '未设置 Token', '点击管理令牌');
    renderSettingsStatus();
    toast('已清除令牌');
  }

  /* ================= Toast ================= */
  var toastTimer = null;
  function toast(msg, type) {
    var t = $('toast');
    t.textContent = msg;
    t.className = 'toast show' + (type === 'err' ? ' err' : '');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { t.classList.remove('show'); }, 2400);
  }

  /* ================= 中断修复（应用刷新后结果未知） ================= */
  function repairInterrupted() {
    if (!state.sessions.length) return;
    var s = state.sessions[0];
    var msgs = loadMsgs(s.id);
    if (msgs.length && msgs[msgs.length - 1].role === 'user') {
      msgs.push({
        id: uid(), role: 'assistant', text: '',
        stderr: '应用刷新，本次执行结果未知，可在「全局记录」中查看。',
        ok: false, exitCode: null, elapsedMs: 0, backend: 'relay',
        sessionId: s.id, at: new Date().toISOString(), interrupted: true
      });
      saveMsgs(s.id, msgs);
    }
  }

  /* ================= 初始化 ================= */
  function boot() {
    state.sessions = loadSessions();
    if (!state.sessions.length) { state.sessions.push(newSessionObj()); saveSessions(); }
    if (!state.currentId || !state.sessions.some(function (s) { return s.id === state.currentId; })) {
      state.currentId = state.sessions[0].id;
    }
    repairInterrupted();
    renderMessages('bottom');
    renderSessionList();
    updateBrandSub();
    renderSettingsStatus();
    updateInputLock();

    if (state.token) {
      bootConnectivity(); // 内含 ensureHeartbeat()
    } else {
      setConn('na', '未设置 Token', '点击管理令牌');
      openTokenOverlay('首次使用：输入电脑端 Agent 启动日志中打印的访问令牌');
    }

    $('menuBtn').addEventListener('click', openDrawer);
    $('apprBadge').addEventListener('click', scrollToPendingApproval);
    $('sessionTitle').addEventListener('click', openDrawer);
    $('scrim').addEventListener('click', closeDrawer);
    $('drawerClose').addEventListener('click', closeDrawer);
    $('newSessBtn').addEventListener('click', function () { newSession(); openDrawer(); });
    $('sendBtn').addEventListener('click', sendMessage);
    $('connPill').addEventListener('click', function () { refreshStatus(true); });
    $('ghRefresh').addEventListener('click', function () { refreshGlobalHistory(false); });
    $('stRefresh').addEventListener('click', function () { bootConnectivity(); toast('正在重新检测…'); });
    $('tokenOpen').addEventListener('click', function () { openTokenOverlay(); });
    $('tokenSave').addEventListener('click', saveTokenFromOverlay);
    $('tokenClear').addEventListener('click', clearToken);
    $('tokenCancel').addEventListener('click', closeTokenOverlay);
    $('tokenToggle').addEventListener('click', toggleTokenVisible);

    $('input').addEventListener('keydown', function (e) {
      if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) {
        e.preventDefault();
        sendMessage();
      }
    });
    $('input').addEventListener('input', function () { autoGrow($('input')); });
    document.addEventListener('visibilitychange', function () {
      if (!document.hidden) { refreshStatus(false); refreshGlobalHistory(true); refreshApprovals(); }
    });
  }

  boot();

  /* ================= 调试接口 ================= */
  window.__app = {
    state: state,
    api: api,
    sendMessage: sendMessage,
    newSession: newSession,
    switchSession: switchSession,
    deleteSession: deleteSession,
    refreshStatus: refreshStatus,
    refreshGlobalHistory: refreshGlobalHistory,
    probeSessions: probeSessions,
    refreshApprovals: refreshApprovals,
    decideApproval: decideApproval,
    scrollToPendingApproval: scrollToPendingApproval,
    openDrawer: openDrawer,
    closeDrawer: closeDrawer,
    openTokenOverlay: openTokenOverlay,
    saveTokenFromOverlay: saveTokenFromOverlay,
    clearToken: clearToken,
    renderMarkdown: renderMarkdown,
    fmtElapsed: fmtElapsed,
    fmtTime: fmtTime,
    escHtml: escHtml,
    toast: toast,
    loadMsgs: loadMsgs,
    renderMessages: renderMessages
  };
})();
</script>
</body>
</html>
