<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#0A0A0A">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Harness Cloud">
<title>DeepSeek Harness · 云端</title>
<style>
  :root {
    --bg: #0A0A0A;
    --bg-2: #111118;
    --bg-3: #131320;
    --card: rgba(26, 26, 34, 0.72);
    --card-solid: #1A1A22;
    --card-2: #22222C;
    --bubble: #23232E;
    --border: #33333F;
    --border-soft: rgba(255, 255, 255, 0.08);
    --text: #F2F2F4;
    --muted: #A6A6B4;
    --faint: #787888;
    --accent: #4D6BFE;
    --accent-2: #6C8CFF;
    --accent-soft: rgba(77, 107, 254, 0.14);
    --ok: #34C77B;
    --ok-soft: rgba(52, 199, 123, 0.14);
    --err: #F87171;
    --err-soft: rgba(248, 113, 113, 0.14);
    --radius: 18px;
    --radius-sm: 14px;
    --spring: cubic-bezier(0.32, 0.72, 0, 1);
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
    --safe-left: env(safe-area-inset-left, 0px);
    --safe-right: env(safe-area-inset-right, 0px);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;
    background:
      radial-gradient(130% 42% at 50% -8%, rgba(77, 107, 254, 0.16), transparent 62%),
      radial-gradient(80% 36% at 88% 110%, rgba(108, 140, 255, 0.10), transparent 60%),
      linear-gradient(180deg, #0A0A0A 0%, #131320 100%);
    background-attachment: fixed;
    color: var(--text);
    min-height: 100vh;
    -webkit-tap-highlight-color: transparent;
  }
  button { font-family: inherit; touch-action: manipulation; cursor: pointer; }
  input, textarea { font-family: inherit; }

  .app { max-width: 780px; margin: 0 auto; min-height: 100vh; display: flex; flex-direction: column; }
  @media (min-width: 781px) { .app { border-left: 1px solid var(--border-soft); border-right: 1px solid var(--border-soft); } }

  /* ========== 顶部栏（毛玻璃） ========== */
  .topbar {
    display: flex; align-items: center; gap: 10px;
    padding: calc(var(--safe-top) + 6px) 12px 8px;
    background: rgba(16, 16, 22, 0.72);
    -webkit-backdrop-filter: blur(20px) saturate(150%);
    backdrop-filter: blur(20px) saturate(150%);
    border-bottom: 1px solid var(--border-soft);
    z-index: 30; flex: none;
  }
  .brand { display: flex; align-items: center; gap: 8px; flex: 1; min-width: 0; }
  .whale { width: 26px; height: 26px; flex: none; }
  .brand-name { font-size: 15px; font-weight: 700; letter-spacing: 0.2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .brand-sub { font-size: 11px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .conn-pill {
    display: flex; align-items: center; gap: 6px; flex: none;
    background: rgba(255,255,255,0.05); border: 1px solid var(--border-soft);
    border-radius: 999px; padding: 5px 12px; font-size: 12px; color: var(--muted);
  }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--faint); flex: none; }
  .dot.on { background: var(--ok); box-shadow: 0 0 8px rgba(52,199,123,.6); }
  .dot.err { background: var(--err); box-shadow: 0 0 8px rgba(248,113,113,.6); }

  /* ========== 主内容 ========== */
  .content { flex: 1; overflow-y: auto; padding: 14px 14px calc(24px + var(--safe-bottom)); }
  .section { display: none; }
  .section.active { display: block; }

  .hero { text-align: center; padding: 30px 0 20px; }
  .hero .whale-lg { width: 64px; height: 64px; margin: 0 auto 12px; }
  .hero h1 { font-size: 22px; font-weight: 800; }
  .hero p { color: var(--muted); font-size: 13.5px; margin-top: 6px; line-height: 1.6; }

  .card {
    background: var(--card);
    -webkit-backdrop-filter: blur(20px) saturate(150%);
    backdrop-filter: blur(20px) saturate(150%);
    border: 1px solid var(--border-soft);
    border-radius: var(--radius);
    padding: 16px; margin-bottom: 14px;
  }
  .card h2 { font-size: 13px; font-weight: 700; color: var(--muted); letter-spacing: 0.4px; margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }
  label { display: block; font-size: 12px; color: var(--muted); margin: 10px 0 5px; }
  input[type=text], input[type=password], textarea {
    width: 100%; background: var(--card-2); border: 1px solid var(--border);
    color: var(--text); border-radius: var(--radius-sm); padding: 11px 13px; font-size: 15px; outline: none;
    -webkit-appearance: none; appearance: none;
  }
  input:focus, textarea:focus { border-color: var(--accent); }
  textarea { min-height: 84px; resize: vertical; }
  .row { display: flex; gap: 8px; margin-top: 12px; }
  .row button { flex: 1; }

  .btn {
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    border: none; color: #fff; border-radius: var(--radius-sm);
    padding: 12px 14px; font-size: 14.5px; font-weight: 700; width: 100%;
    transition: transform .12s var(--spring), opacity .15s;
  }
  .btn:active { transform: scale(0.97); }
  .btn:disabled { opacity: .5; }
  .btn.ghost { background: rgba(255,255,255,0.05); border: 1px solid var(--border-soft); color: var(--muted); }
  .btn.danger { background: none; border: 1px solid rgba(248,113,113,.4); color: var(--err); }
  .btn.sm { width: auto; padding: 6px 12px; font-size: 12.5px; border-radius: 999px; }

  /* ========== 设备列表 ========== */
  .dev-list { display: flex; flex-direction: column; gap: 8px; }
  .dev-item {
    display: flex; align-items: center; gap: 12px;
    background: var(--card); border: 1px solid var(--border-soft); border-radius: var(--radius-sm);
    padding: 12px 14px;
  }
  .dev-icon { width: 38px; height: 38px; border-radius: 12px; background: var(--accent-soft); display: flex; align-items: center; justify-content: center; flex: none; }
  .dev-icon svg { width: 20px; height: 20px; stroke: var(--accent-2); }
  .dev-info { flex: 1; min-width: 0; }
  .dev-name { font-size: 14.5px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .dev-meta { font-size: 11.5px; color: var(--muted); margin-top: 2px; }
  .badge { font-size: 10.5px; padding: 2px 8px; border-radius: 999px; background: rgba(255,255,255,.07); color: var(--muted); flex: none; }
  .badge.on { background: var(--ok-soft); color: var(--ok); }
  .badge.off { background: rgba(248,113,113,.12); color: var(--err); }
  .empty { text-align: center; color: var(--faint); font-size: 13px; padding: 22px 10px; line-height: 1.7; }

  /* ========== 聊天 ========== */
  .chat { display: flex; flex-direction: column; gap: 10px; padding: 6px 0 12px; }
  .msg { display: flex; max-width: 100%; }
  .msg.user { justify-content: flex-end; }
  .msg .bubble {
    padding: 11px 15px; border-radius: 18px; font-size: 14.5px; line-height: 1.65;
    white-space: pre-wrap; word-break: break-word; max-width: 86%;
    background: var(--bubble); border: 1px solid var(--border-soft);
  }
  .msg.user .bubble { background: linear-gradient(135deg, var(--accent), var(--accent-2)); border: none; color: #fff; }
  .msg .meta { font-size: 10.5px; color: var(--faint); margin-top: 4px; }
  .appr-card { border: 1px solid rgba(77,107,254,.5); border-radius: var(--radius-sm); background: var(--card-2); padding: 13px; }
  .appr-title { font-weight: 700; font-size: 13.5px; margin-bottom: 4px; }
  .appr-reason { font-size: 12.5px; color: var(--muted); margin-bottom: 10px; word-break: break-word; }

  .task-list { display: flex; flex-direction: column; gap: 6px; margin-top: 10px; }
  .task-item {
    display: flex; align-items: center; gap: 10px; padding: 10px 12px;
    background: rgba(255,255,255,0.03); border: 1px solid var(--border-soft); border-radius: 12px;
  }
  .task-item .t { font-size: 13px; font-weight: 600; font-family: var(--mono, monospace); }
  .task-item .s { font-size: 11px; color: var(--muted); }

  .toast {
    position: fixed; left: 50%; bottom: 34px; transform: translateX(-50%) translateY(20px);
    opacity: 0; transition: .25s; z-index: 60;
    background: rgba(30,30,40,0.95); border: 1px solid var(--border-soft); border-radius: 12px;
    padding: 10px 18px; font-size: 13px; max-width: 86vw; text-align: center;
    -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px);
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  .toast.err { border-color: rgba(248,113,113,.5); color: var(--err); }
  .hidden { display: none !important; }
  .sub { color: var(--muted); font-size: 12px; margin-top: 6px; line-height: 1.6; }
</style>
</head>
<body>
<div class="app">
  <!-- 顶部栏 -->
  <header class="topbar">
    <div class="brand">
      <svg class="whale" viewBox="0 0 24 24" fill="none" stroke="#6C8CFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 14c0-4 3-8 9-8 5 0 9 3 9 7 0 3-2 5-5 5-2 0-3-1-4-2-1 1-2 2-4 2-3 0-5-2-5-4z"/><path d="M3 14c-1 0-2-1-2-2s1-2 2-2"/><circle cx="17.5" cy="11" r=".6" fill="#6C8CFF"/><path d="M7 10l2 1-2 1"/></svg>
      <div style="min-width:0">
        <div class="brand-name">deepseekharness</div>
        <div class="brand-sub" id="connSub">未连接云端</div>
      </div>
    </div>
    <button class="conn-pill" id="connPill" type="button"><span class="dot" id="connDot"></span><span id="connLabel">检测中…</span></button>
  </header>

  <div class="content">
    <!-- ========== 账号（未登录） ========== -->
    <section class="section active" id="secAuth">
      <div class="hero">
        <svg class="whale-lg" viewBox="0 0 24 24" fill="none" stroke="#6C8CFF" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 14c0-4 3-8 9-8 5 0 9 3 9 7 0 3-2 5-5 5-2 0-3-1-4-2-1 1-2 2-4 2-3 0-5-2-5-4z"/><path d="M3 14c-1 0-2-1-2-2s1-2 2-2"/><circle cx="17.5" cy="11" r=".6" fill="#6C8CFF"/><path d="M7 10l2 1-2 1"/></svg>
        <h1>云端远程控制</h1>
        <p>任何网络下，远程控制家里电脑上的 DSH Agent</p>
      </div>
      <div class="card">
        <h2>云 端 连 接</h2>
        <label>云端地址</label>
        <input id="cloudUrl" type="text" placeholder="https://relay.axyntara.cn" autocomplete="off">
        <label>用户名（无需邮箱）</label>
        <input id="email" type="text" placeholder="任意用户名" autocomplete="off">
        <label>密码</label>
        <input id="password" type="password" placeholder="••••••••" autocomplete="off">
        <div class="row">
          <button class="btn" id="loginBtn">登 录</button>
          <button class="btn ghost" id="regBtn">注 册</button>
        </div>
        <div class="sub" id="accountState">未登录，可先注册一个云端账号。</div>
      </div>
    </section>

    <!-- ========== 设备（已登录） ========== -->
    <section class="section" id="secDevices">
      <div class="hero">
        <svg class="whale-lg" viewBox="0 0 24 24" fill="none" stroke="#6C8CFF" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 14c0-4 3-8 9-8 5 0 9 3 9 7 0 3-2 5-5 5-2 0-3-1-4-2-1 1-2 2-4 2-3 0-5-2-5-4z"/><path d="M3 14c-1 0-2-1-2-2s1-2 2-2"/><circle cx="17.5" cy="11" r=".6" fill="#6C8CFF"/><path d="M7 10l2 1-2 1"/></svg>
        <h1>我的设备</h1>
        <p id="whoAmI" class="sub" style="margin-top:6px"></p>
      </div>
      <div class="card">
        <h2>设 备 列 表 <span style="flex:1"></span><button class="btn ghost sm" id="refreshDev" type="button">刷新</button></h2>
        <div class="dev-list" id="deviceList"></div>
        <div class="empty hidden" id="deviceEmpty">还没有绑定设备。<br>先在电脑端启动 Agent，然后输入配对码绑定。</div>
      </div>
      <div class="card">
        <h2>绑 定 设 备</h2>
        <label>设备 ID（电脑端 Agent 显示的 ID）</label>
        <input id="pairAgentId" placeholder="如 win-agent-home" autocomplete="off">
        <label>配对码（电脑端 Agent 启动时显示，15 分钟有效）</label>
        <input id="pairCode" placeholder="8 位，如 Q42NAFAU" autocomplete="off">
        <button class="btn" id="pairBtn" type="button" style="margin-top:12px">绑 定 设 备</button>
        <div class="sub">已绑定过的设备会自动出现在列表里，无需重复绑定。</div>
      </div>
    </section>

    <!-- ========== 对话（选设备后） ========== -->
    <section class="section" id="secChat">
      <div class="topbar" style="position:sticky;top:0;margin:0 -14px 10px;border-radius:0">
        <button class="btn ghost sm" id="backToDev" type="button">← 设备</button>
        <div class="brand" style="flex:1">
          <div class="brand-name" id="chatDeviceName">设备</div>
          <div class="brand-sub" id="chatDeviceState"></div>
        </div>
      </div>
      <div class="card">
        <div class="chat" id="chat"></div>
        <div class="task-list hidden" id="taskHistory"></div>
        <label>发任务给电脑</label>
        <textarea id="taskPrompt" placeholder="例如：帮我整理桌面文件到 工作/ 文件夹…"></textarea>
        <button class="btn" id="sendTask" type="button" style="margin-top:10px">发 送 到 电 脑</button>
      </div>
    </section>
  </div>
</div>

<div class="toast" id="toast"></div>

<script type="module">
import { generateKeyPair, deriveSessionKey, generateKeySalt, encrypt, decrypt } from './e2ee-web.js';
(function () {
  'use strict';
  var $ = function (id) { return document.getElementById(id); };
  var LS = 'ph_cloud_';
  function load(key, d) { try { return JSON.parse(localStorage.getItem(LS + key)); } catch (e) { return d; } }
  function save(key, val) { localStorage.setItem(LS + key, JSON.stringify(val)); }

  var state = {
    baseUrl: localStorage.getItem(LS + 'baseUrl') || 'https://relay.axyntara.cn',
    userId: localStorage.getItem(LS + 'userId') || '',
    email: localStorage.getItem(LS + 'email') || '',
    deviceId: null,
    taskId: null,
    phoneKey: null,
    devices: [],
  };

  var PROMPT_AAD = 'ph-task';
  var saltByTask = load('salt', {});
  function saveSaltByTask() { save('salt', saltByTask); }

  function toast(msg, isErr) {
    var t = $('toast'); t.textContent = msg; t.className = 'toast show' + (isErr ? ' err' : '');
    clearTimeout(t._tm); t._tm = setTimeout(function () { t.className = 'toast'; }, 2600);
  }
  function esc(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
  function showSec(id) {
    ['secAuth', 'secDevices', 'secChat'].forEach(function (s) { $(s).classList.toggle('active', s === id); });
  }

  async function api(path, opts) {
    opts = opts || {};
    var u = state.baseUrl.replace(/\/+$/, '') + path;
    var h = { 'content-type': 'application/json' };
    if (state.userId) h['x-user-id'] = state.userId;
    var r;
    try { r = await fetch(u, { method: opts.method || 'GET', headers: h, body: opts.body }); }
    catch (e) { throw new Error('无法连接云端：' + e.message); }
    var data = null; try { data = await r.json(); } catch (e) {}
    if (!r.ok) throw new Error((data && data.error) || ('HTTP ' + r.status));
    return data;
  }

  function setConn(ok, label) {
    $('connDot').className = 'dot' + (ok === false ? ' err' : ok ? ' on' : '');
    $('connLabel').textContent = label;
  }
  async function checkConn() {
    if (!state.baseUrl) { setConn(false, '未配置云端'); return false; }
    try { await api('/v1/status'); setConn(true, '云端在线'); return true; }
    catch (e) { setConn(false, '云端不可达'); return false; }
  }

  // ============ 账号 ============
  async function register() {
    var em = $('email').value.trim(), pw = $('password').value;
    if (!em || !pw) return toast('用户名/密码必填', true);
    try {
      await api('/v1/auth/register', { method: 'POST', body: JSON.stringify({ email: em, password: pw }) });
      toast('注册成功，请登录'); $('password').value = '';
    } catch (e) { toast('注册失败: ' + e.message, true); }
  }
  async function doLogin() {
    var em = $('email').value.trim(), pw = $('password').value;
    if (!em || !pw) return toast('用户名/密码必填', true);
    try {
      var d = await api('/v1/auth/login', { method: 'POST', body: JSON.stringify({ email: em, password: pw }) });
      state.userId = d.userId; state.email = d.email;
      localStorage.setItem(LS + 'userId', d.userId); localStorage.setItem(LS + 'email', d.email);
      $('whoAmI').textContent = '已登录：' + d.email;
      toast('登录成功'); showSec('secDevices'); loadDevices();
    } catch (e) { toast('登录失败: ' + e.message, true); }
  }

  // ============ 设备 ============
  async function loadDevices() {
    if (!state.userId) return;
    var box = $('deviceList'); box.innerHTML = '';
    $('deviceEmpty').classList.add('hidden');
    try {
      var d = await api('/v1/devices?userId=' + encodeURIComponent(state.userId));
      state.devices = d.items || [];
    } catch (e) { state.devices = []; }
    if (!state.devices.length) { $('deviceEmpty').classList.remove('hidden'); return; }
    renderDevices(state.devices);
  }
  function renderDevices(list) {
    var box = $('deviceList'); box.innerHTML = '';
    list.forEach(function (d) {
      var it = document.createElement('div'); it.className = 'dev-item';
      var icon = document.createElement('div'); icon.className = 'dev-icon';
      icon.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="14" rx="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="18" x2="12" y2="21"/></svg>';
      var info = document.createElement('div'); info.className = 'dev-info';
      info.innerHTML = '<div class="dev-name">' + esc(d.agent_id || d.agentId || '设备') + '</div>' +
        '<div class="dev-meta">' + esc(d.status || 'online') + ' · 最后在线 ' + esc((d.last_seen_at || '').slice(0, 16).replace('T', ' ')) + '</div>';
      var badge = document.createElement('span');
      badge.className = 'badge ' + (d.status === 'online' ? 'on' : 'off');
      badge.textContent = d.status === 'online' ? '在线' : '离线';
      var btn = document.createElement('button'); btn.className = 'btn ghost sm'; btn.textContent = '进入';
      btn.onclick = function () { openDevice(d.agent_id || d.agentId); };
      it.appendChild(icon); it.appendChild(info); it.appendChild(badge); it.appendChild(btn);
      box.appendChild(it);
    });
  }
  async function pairDevice() {
    var agentId = $('pairAgentId').value.trim(), code = $('pairCode').value.trim().toUpperCase();
    if (!agentId || !code) return toast('设备 ID 和配对码必填', true);
    try {
      await api('/v1/devices/' + encodeURIComponent(agentId) + '/pair', { method: 'POST', body: JSON.stringify({ pairCode: code, userId: state.userId }) });
      toast('设备已绑定'); $('pairAgentId').value = ''; $('pairCode').value = '';
      loadDevices();
    } catch (e) { toast('配对失败: ' + e.message, true); }
  }

  // ============ 对话 ============
  function openDevice(agentId) {
    state.deviceId = agentId;
    $('chatDeviceName').textContent = '设备：' + agentId;
    $('chat').innerHTML = ''; $('taskHistory').innerHTML = ''; $('taskHistory').classList.add('hidden');
    showSec('secChat');
    loadTasks();
  }
  async function loadTasks() {
    if (!state.deviceId) return;
    try {
      var d = await api('/v1/tasks?deviceId=' + encodeURIComponent(state.deviceId));
      var items = (d.items || []).slice(0, 20);
      var box = $('taskHistory');
      if (items.length) { box.classList.remove('hidden'); box.innerHTML = ''; }
      items.forEach(function (t) {
        var it = document.createElement('div'); it.className = 'task-item';
        it.innerHTML = '<div class="t">' + esc(t.id.slice(0, 8)) + '</div><div class="s">' + esc(t.status) + '</div>';
        it.onclick = function () { openTask(t); };
        box.appendChild(it);
      });
    } catch (e) { /* 忽略 */ }
  }
  function appendMsg(role, text, meta) {
    var m = document.createElement('div'); m.className = 'msg ' + role;
    m.innerHTML = '<div class="bubble">' + esc(text) + '</div>' + (meta ? '<div class="meta">' + esc(meta) + '</div>' : '');
    $('chat').appendChild(m);
    var c = $('chat'); c.scrollTop = c.scrollHeight;
  }
  function appendApproval(a) {
    var c = document.createElement('div'); c.className = 'appr-card';
    c.innerHTML = '<div class="appr-title">需要授权</div><div class="appr-reason">' + esc(a.reason || '') + '</div>' +
      '<div class="row"><button class="btn sm" data-d="allow">允许一次</button><button class="btn danger sm" data-d="deny">拒绝</button></div>';
    c.querySelector('[data-d="allow"]').onclick = function () { decide(a, 'allow'); };
    c.querySelector('[data-d="deny"]').onclick = function () { decide(a, 'deny'); };
    $('chat').appendChild(c);
  }
  async function decide(a, decision) {
    try {
      await api('/v1/tasks/' + a.taskId + '/confirm', { method: 'POST', body: JSON.stringify({ decision: decision, userId: state.userId }) });
      toast(decision === 'allow' ? '已允许' : '已拒绝'); loadTasks();
    } catch (e) { toast('确认失败: ' + e.message, true); }
  }

  // ============ E2EE ============
  function ensurePhoneKey() {
    if (state.phoneKey) return Promise.resolve(state.phoneKey);
    var saved = localStorage.getItem(LS + 'pkey');
    if (saved) { try { state.phoneKey = JSON.parse(saved); return Promise.resolve(state.phoneKey); } catch (e) {} }
    return generateKeyPair().then(function (pair) {
      state.phoneKey = pair;
      localStorage.setItem(LS + 'pkey', JSON.stringify(pair));
      return pair;
    });
  }
  async function getDeviceE2ee(agentId) {
    var d = await api('/v1/devices/' + encodeURIComponent(agentId));
    if (!d || !d.device || !d.device.publicKey) return null;
    try { return JSON.parse(d.device.publicKey); } catch (e) { return null; }
  }
  async function decryptResult(t) {
    try {
      var phone = await ensurePhoneKey();
      var agentPub = await getDeviceE2ee(state.deviceId);
      var salt = saltByTask[t.id];
      if (!agentPub || !t.result_cipher || !salt) return null;
      var key = await deriveSessionKey(phone.privateKey, agentPub, salt);
      var r = await decrypt(key, { ciphertext: t.result_cipher.ciphertext, iv: t.result_cipher.iv || t.result_cipher.nonce, tag: t.result_cipher.tag }, t.id);
      if (!r) return null;
      return new TextDecoder().decode(r);
    } catch (e) { return null; }
  }
  function openTask(t) {
    state.taskId = t.id;
    $('chat').innerHTML = '';
    appendMsg('user', '任务 #' + t.id.slice(0, 8), t.created_at ? new Date(t.created_at).toLocaleString() : '');
    appendMsg('asst', '状态：' + (t.status || 'queued'));
    if (t.result_cipher) {
      appendMsg('asst', '（解密结果…）');
      decryptResult(t).then(function (plain) {
        var msgs = $('chat').querySelectorAll('.msg');
        var last = msgs[msgs.length - 1];
        if (last) last.querySelector('.bubble').textContent = plain ? plain : '（结果密文，无法解密）';
      });
    } else if (t.status === 'confirming') {
      appendApproval({ taskId: t.id, reason: '高风险动作待确认' });
    }
  }
  async function sendTask() {
    if (!state.deviceId) return toast('请先选择设备', true);
    var text = $('taskPrompt').value.trim(); if (!text) return toast('请输入任务', true);
    var salt = generateKeySalt();
    var phone = await ensurePhoneKey();
    var agentPub = await getDeviceE2ee(state.deviceId);
    if (!agentPub) { toast('设备未就绪（缺 E2EE 公钥），请重新绑定', true); return; }
    try {
      var key = await deriveSessionKey(phone.privateKey, agentPub, salt);
      var box = await encrypt(key, text, PROMPT_AAD);
      var d = await api('/v1/tasks', { method: 'POST', body: JSON.stringify({
        deviceId: state.deviceId, userId: state.userId, requireConfirm: false,
        promptCipher: box, salt: salt, senderKey: phone.publicKey
      }) });
      if (d && d.taskId) { saltByTask[d.taskId] = salt; saveSaltByTask(); }
      toast('任务已加密下发'); $('taskPrompt').value = '';
      appendMsg('user', text, '已加密下发');
      appendMsg('asst', '任务排队中，Agent 会尽快执行…');
      loadTasks();
      pollTask(d.taskId, 3000);
    } catch (e) { toast('下发失败: ' + e.message, true); }
  }
  function pollTask(taskId, interval) {
    var n = 0;
    var timer = setInterval(async function () {
      n++;
      try {
        var d = await api('/v1/tasks/' + taskId);
        var t = d.task;
        if (t && ['succeeded', 'failed', 'timeout', 'cancelled'].indexOf(t.status) >= 0) {
          clearInterval(timer);
          appendMsg('asst', '任务' + (t.status === 'succeeded' ? '完成 ✅' : '结束：' + t.status));
          if (t.result_cipher) {
            var plain = await decryptResult(t);
            if (plain) appendMsg('asst', plain, '执行结果');
          }
        }
      } catch (e) {}
      if (n > 100) clearInterval(timer); // 最多轮询 5 分钟
    }, interval);
  }

  // ============ 装配 ============
  function init() {
    $('cloudUrl').value = state.baseUrl;
    $('email').value = localStorage.getItem(LS + 'email') || '';
    $('loginBtn').addEventListener('click', doLogin);
    $('regBtn').addEventListener('click', register);
    $('pairBtn').addEventListener('click', pairDevice);
    $('refreshDev').addEventListener('click', loadDevices);
    $('backToDev').addEventListener('click', function () { state.deviceId = null; showSec('secDevices'); loadDevices(); });
    $('sendTask').addEventListener('click', sendTask);
    $('connPill').addEventListener('click', checkConn);
    $('cloudUrl').addEventListener('change', function () {
      state.baseUrl = $('cloudUrl').value.trim();
      localStorage.setItem(LS + 'baseUrl', state.baseUrl);
      checkConn();
    });
    if (state.userId) { $('whoAmI').textContent = '已登录：' + state.email; showSec('secDevices'); loadDevices(); }
    else { showSec('secAuth'); }
    checkConn();
  }
  init();
})();
</script>
